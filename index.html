<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://api.github.com; worker-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f3f2f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0b0d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Morgenpuls">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Morgenpuls</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: én smal kolonne (mobil først), klebrig fanelinje øverst, kort med rød markeringslinje for det som er nytt. */
:root{
  --bg:#f3f2f0; --surface:#ffffff; --surface-2:#ebe9e6; --line:#dcd9d4;
  --fg:#17161a; --muted:#6c6870; --accent:#d7262e; --accent-soft:#fbe3e3;
  --ok:#1f8a4c; --warn:#b26a00; --ok-soft:#dff2e6; --warn-soft:#fbeed8;
  --tp-geo:#2a6fd6; --tp-hel:#d2357f; --tp-his:#d9a400; --tp-vit:#2f9a4f; --tp-fin:#8a5a2b; --tp-spo:#e8701f;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c0b0d; --surface:#18171b; --surface-2:#232127; --line:#2e2c33;
  --fg:#f2f0f3; --muted:#9a96a0; --accent:#ef3b42; --accent-soft:#3a1517;
  --ok:#4cc27c; --warn:#e5a33a; --ok-soft:#14301f; --warn-soft:#33240e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c0b0d; --surface:#18171b; --surface-2:#232127; --line:#2e2c33;
  --fg:#f2f0f3; --muted:#9a96a0; --accent:#ef3b42; --accent-soft:#3a1517;
  --ok:#4cc27c; --warn:#e5a33a; --ok-soft:#14301f; --warn-soft:#33240e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 0}
.brand{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}
.mark{width:32px;height:32px;border-radius:9px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;position:relative}
.mark::after{content:"";position:absolute;right:9px;bottom:8px;width:4px;height:4px;background:var(--accent);border-radius:1px}
.wordmark{font-family:var(--f-mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;font-weight:500}
.wordmark span{color:var(--muted)}
.dayctl{display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;padding:4px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.plain::before{display:none}
select.day{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-family:var(--f-mono);font-size:12px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-top:12px;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:10px 12px 11px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab .n{font-family:var(--f-mono);font-size:11px;margin-left:5px;color:var(--muted)}

/* generic */
section.view{display:grid;gap:16px;padding-top:18px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(26px,6vw,38px);font-weight:800;line-height:1.05}
h2{font-size:20px;font-weight:800}
h3{font-size:17px;font-weight:700;line-height:1.3}
p{margin:0}
.muted{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stack{display:grid;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;color:var(--muted);text-align:left}
.empty b{color:var(--fg)}
.badge{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border-radius:5px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.rct{border-color:var(--accent);color:var(--accent)}
.link{font-weight:600;text-decoration:none;display:inline-flex;gap:4px;align-items:center}
.link::after{content:"↗";color:var(--accent);font-size:13px}
.link:hover{text-decoration:underline}
.tnum{font-variant-numeric:tabular-nums}
input.txt,textarea.txt,select.txt{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
textarea.txt{min-height:110px;resize:vertical;line-height:1.45}
label.lbl{display:grid;gap:5px;font-size:13px;font-weight:600}
.mer{margin-top:14px;text-align:left;font-size:14px;color:var(--muted)}
.mer summary{cursor:pointer;font-size:13px;letter-spacing:.02em;text-transform:uppercase;color:var(--muted);padding:4px 0}
.mer[open] summary{margin-bottom:8px}
.modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal .sheet{background:var(--surface);color:var(--fg);width:100%;max-width:560px;max-height:82vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.18)}
@media (min-width:640px){.modal{align-items:center}.modal .sheet{border-radius:16px}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}

/* oversikt */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:560px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;cursor:pointer;display:grid;gap:2px}
.tile:hover{border-color:var(--muted)}
.tile .big{font-family:var(--f-display);font-size:30px;font-weight:800;line-height:1}
.tile .lab{font-size:13px;color:var(--muted)}
.hero-date{display:grid;gap:6px}

/* helse */
.hhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pmlogo{font-family:var(--f-display);font-weight:800;font-size:18px;background:var(--fg);color:var(--bg);padding:6px 12px;border-radius:9px}
.count{text-align:right}
.count .big{font-family:var(--f-display);font-size:42px;font-weight:800;line-height:.95}
.segbar{display:flex;gap:4px;height:8px;margin-top:16px}
.segbar i{display:block;border-radius:4px;min-width:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{color:var(--fg);font-variant-numeric:tabular-nums}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:600;font-size:14px}
.chip .x{border:0;background:none;color:var(--muted);cursor:pointer;padding:0 0 0 2px;font-size:15px;line-height:1}
.chip.on::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
button.chip{cursor:pointer}
button.chip:hover{border-color:var(--muted)}
.chip .cnt{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:500}
.chip.sel{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip.sel .cnt{color:var(--bg);opacity:.75}
.chip.sel::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.legend .lg{background:none;border:0;padding:3px 6px;margin:-3px -6px;border-radius:6px;display:inline-flex;align-items:center;gap:6px;color:var(--muted);cursor:pointer;font-size:13px}
.legend .lg:hover{background:var(--surface-2)}
.legend .lg.sel{background:var(--surface-2);color:var(--fg)}
.legend .lg.dim{opacity:.45}
.card .q.hq{font-size:clamp(19px,4.6vw,25px);max-width:30ch}
.fbwrap{width:100%;overflow-x:auto}
svg.fb{width:100%;height:auto;display:block}
.notes-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.notes-grid.nat{grid-template-columns:repeat(7,minmax(0,1fr))}
.notes-grid .opt{text-align:center;padding:10px 0}
@media (max-width:460px){.notes-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.notes-grid.nat{grid-template-columns:repeat(4,minmax(0,1fr))}}
.strbars{display:grid;gap:8px}
.strbar{display:grid;grid-template-columns:24px minmax(0,1fr) 48px;gap:10px;align-items:center;font-family:var(--f-mono);font-size:12px}
.chordgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.chord{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 8px 10px;display:grid;justify-items:center;gap:4px}
.chord.known{border-color:var(--ok)}
.chordbtn{background:none;border:0;cursor:pointer;display:grid;justify-items:center;gap:2px;padding:4px;border-radius:8px;width:100%}
.chordbtn:hover{background:var(--surface-2)}
.chordbtn b{font-family:var(--f-display);font-size:17px}
svg.chordsvg{width:100px;height:auto}
.check.small{font-size:12px;color:var(--muted)}
.metnum{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1}
input[type=range]{width:100%;accent-color:var(--accent)}
/* trading */

.iconbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;cursor:pointer;font-size:12px;font-weight:600;color:var(--fg)}
.iconbtn:hover{border-color:var(--muted)}
.impcat{display:grid;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.impsub{display:grid;gap:6px;padding-left:10px}
.impsub b{font-size:14px}
.improw{display:grid;grid-template-columns:auto minmax(0,2fr) minmax(0,1fr) minmax(0,1fr);gap:6px;align-items:center}
.improw.off{opacity:.45}
.improw .txt{padding:6px 8px;font-size:13px}
@media (max-width:560px){.improw{grid-template-columns:auto minmax(0,1fr)}.improw select,.improw [data-impsub]{grid-column:2}}

.savebtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.savebtn:hover{border-color:var(--muted)}
.savebtn.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.badge.big{border-color:var(--ok);color:var(--ok)}
.nb.link,.nb.score{align-items:center}
.bookmark{flex:1;display:grid;gap:2px;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.bookmark:hover{border-color:var(--muted)}
.bookmark span{font-size:12px}
.bookmark b,.bookmark span{overflow-wrap:anywhere}
.sc{flex:1;display:grid;gap:8px;padding:6px 0}
.sc .muted{font-size:13px}
.scale{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;max-width:440px}
.scale button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 0;cursor:pointer;font-weight:700;font-variant-numeric:tabular-nums}
.scale button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.jcard{border-left:3px solid var(--accent)}
.jlist{margin:0;padding-left:18px;display:grid;gap:3px}
.jdeep{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--surface-2, rgba(127,127,127,.08))}
.jhist{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap}
.jhist div{display:flex;gap:3px;align-items:flex-end;height:36px}
.jhist div span{font-family:var(--f-mono);font-size:11px;margin-right:3px}
.jhist i{display:block;width:8px;background:var(--accent);border-radius:2px 2px 0 0;opacity:.85}
.pos{color:var(--ok)} .neg{color:var(--accent)}
.tile.static{cursor:default}.tile.static:hover{border-color:var(--line)}
.tile .big small{font-size:16px;font-weight:700}
.notice{border:1px solid var(--warn);background:var(--warn-soft);color:var(--fg);border-radius:12px;padding:10px 14px;font-size:14px}
.posrow{display:grid;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.posrow:last-of-type{border-bottom:0}
.pos-h{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.sym{font-family:var(--f-display);font-size:18px}
.pbar{position:relative;height:10px;background:var(--surface-2);border-radius:5px;margin:4px 6px}
.pfill{position:absolute;top:0;bottom:0;border-radius:5px}.pfill.pos{background:var(--ok-soft);border:1px solid var(--ok)}.pfill.neg{background:var(--accent-soft);border:1px solid var(--accent)}
.pmark{position:absolute;top:-4px;width:3px;height:18px;border-radius:2px;transform:translateX(-50%)}
.pmark.stop{background:var(--accent)}.pmark.entry{background:var(--muted)}.pmark.now{background:var(--fg);width:4px}
.plab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.sparkwrap{width:100%}svg.spark{width:100%;height:auto;display:block}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:0 18px}
.kv div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv span{color:var(--muted)}
.tblwrap{overflow-x:auto;width:100%}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:480px}
.tbl th{text-align:left;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td .muted{font-size:12px}
.trades{display:grid}
.trow2{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.trow2 .muted{font-size:12.5px}
.tright{text-align:right}
.trline{display:grid;gap:4px;text-align:left;cursor:pointer;width:100%}
.trline:hover{border-color:var(--muted)}
/* egne kort */
.genrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)}
.genrow.off{opacity:.45}
.srcgrp{border-bottom:1px solid var(--line)}
.srchead{width:100%;display:flex;justify-content:space-between;gap:10px;background:none;border:0;padding:10px 0;cursor:pointer;text-align:left}
.owncard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:8px 0;font-size:14px}
.owncard .x,.nb .x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:0 4px}
.card .ans .a.own{font-size:20px;line-height:1.35;max-width:40ch;font-family:var(--f-body);font-weight:600}
/* notater */
.notes-app{display:grid;grid-template-columns:240px minmax(0,1fr);gap:22px;align-items:start}
.nside{display:grid;gap:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 110px);max-height:calc(100vh - 140px);overflow:auto;padding-bottom:10px}
.tree{display:grid;gap:1px}
.trow{display:flex;align-items:center;gap:2px;border-radius:8px}
.trow.sel{background:var(--surface-2)}
.tw{width:20px;flex:0 0 20px;border:0;background:none;color:var(--muted);cursor:pointer;font-size:11px;padding:0}
.tl{flex:1;min-width:0;text-align:left;border:0;background:none;padding:6px 6px;cursor:pointer;border-radius:6px;font-size:14px;overflow:hidden;text-overflow:ellipsis}
.tl:hover{background:var(--surface-2)}
.nmain{min-width:0}
.ned{position:relative;display:grid;gap:10px;max-width:720px}
.nbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0}
.crumb{border:0;background:none;color:var(--muted);cursor:pointer;padding:2px 4px;border-radius:5px;font-size:13px}
.crumb:hover{background:var(--surface-2);color:var(--fg)}
.nsave{margin-left:auto;font-family:var(--f-mono);font-size:11px}
.ntitle{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,6vw,40px);line-height:1.1;outline:none;letter-spacing:-.01em;word-break:break-word}
[contenteditable]:empty::before{content:attr(data-ph);color:var(--muted);opacity:.6;pointer-events:none}
.nmeta{font-size:12px;font-family:var(--f-mono)}
.nblocks{display:grid;gap:2px}
.nb{display:flex;gap:8px;align-items:flex-start;padding:3px 4px;border-radius:6px;min-height:28px}
.nb:focus-within{background:color-mix(in srgb,var(--surface-2) 55%,transparent)}
.nt{flex:1;min-width:0;outline:none;white-space:pre-wrap;word-break:break-word;line-height:1.6;font-size:16px}
.nb .nt:empty::before{opacity:0}
.nb:focus-within .nt:empty::before,.nb[data-j] .nt:empty::before{opacity:.6}
.nb[data-j]{border-bottom:1px dashed var(--line);border-radius:0}
.nb.h1 .nt{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.25;padding-top:10px}
.nb.h2 .nt{font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.3;padding-top:8px}
.nb.h3 .nt{font-weight:700;font-size:17px;padding-top:4px}
.nb.quote{border-left:3px solid var(--fg);padding-left:12px;border-radius:0}
.nb.quote .nt{font-style:italic}
.nb.callout{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.nb.callout::before{content:"!";font-family:var(--f-display);font-weight:800;color:var(--accent)}
.nb.code{background:var(--surface-2);border-radius:8px;padding:10px 12px}

<script>
/* Morgenpuls som egen app. Leser og skriver data direkte i det private GitHub-repoet med en personlig
   nøkkel som bare ligger på denne enheten (IndexedDB). Repoet er fasiten. Claude-kjøringene skriver
   samme sted, så appen virker selv om ingen kjøring går. Ingen data ligger i dette offentlige repoet. */
(() => {
  const OWNER = "regg92s-hub", REPO = "morgenpuls", BRANCH = "main", API = "https://api.github.com";
  const R = `/repos/${OWNER}/${REPO}`, FILE = p => "data/" + p + ".json";

  const KV = (() => { let dbp; const open = () => dbp || (dbp = new Promise((res, rej) => { const r = indexedDB.open("mp-app", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }));
    const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction("kv", mode); const q = fn(t.objectStore("kv")); t.oncomplete = () => res(q?.result); t.onerror = () => rej(t.error); }); };
    return { get: k => tx("readonly", s => s.get(k)), set: (k, v) => tx("readwrite", s => s.put(v, k)), del: k => tx("readwrite", s => s.delete(k)) }; })();

  let token = null;
  const gh = (path, opt = {}) => fetch(API + path, { ...opt, headers: { Authorization: "Bearer " + token, Accept: opt.raw ? "application/vnd.github.raw+json" : "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", ...(opt.headers || {}) }, cache: "no-store" });
  const b64 = s => { const u = new TextEncoder().encode(s); let bin = ""; const C = 0x8000; for (let i = 0; i < u.length; i += C) bin += String.fromCharCode.apply(null, u.subarray(i, i + C)); return btoa(bin); };
  const clone = v => v == null ? v : JSON.parse(JSON.stringify(v));
  const now = () => new Date().toISOString();

  /* ---------- lokal tilstand ---------- */
  // BUNDLE: bulk-kopien fra repoet. OV: dokumenter som er nyere enn bundelen (egne og andres skrivinger).
  let BUNDLE = { generated_at: null, collections: {}, assets: {} };
  const SKJEMA = 2;   // hoyeste bundelformat denne utgaven av appen forstar
  let OV = Object.create(null);         // "samling/id" -> {d: data|null, t: iso, sha: string|null}
  let META = { head: null };
  let Q = [];                            // skrivekø som overlever omstart
  let saving = false, lastErr = null;
  const listeners = new Set();
  const notify = () => listeners.forEach(l => { try { l(); } catch {} });
  const save = () => { KV.set("ov", OV).catch(() => {}); KV.set("meta", META).catch(() => {}); KV.set("queue", Q).catch(() => {}); };

  const split = path => { const p = String(path).split("/"); return [p.slice(0, -1).join("/"), p[p.length - 1]]; };
  function docVal(path) {                // undefined = finnes ikke
    const o = OV[path]; if (o) return o.d === null ? undefined : o.d;
    const [c, id] = split(path); return BUNDLE.collections?.[c]?.[id];
  }
  function collEntries(coll) {
    const out = new Map();
    const base = BUNDLE.collections?.[coll] || {};
    for (const [id, v] of Object.entries(base)) out.set(id, v);
    for (const [p, o] of Object.entries(OV)) { const [c, id] = split(p); if (c !== coll) continue; if (o.d === null) out.delete(id); else out.set(id, o.d); }
    return [...out].map(([id, v]) => ({ id, v }));
  }
  function putOv(path, data, sha) { OV[path] = { d: data === undefined ? null : data, t: now(), sha: sha ?? OV[path]?.sha ?? null }; }

  /* ---------- samme grensesnitt som databasen i Claude ---------- */
  const docSnap = (id, v) => ({ id, exists: v !== undefined, data: () => clone(v) });
  function runQuery(q) {
    let docs = collEntries(q.coll);
    for (const w of q.wheres || []) docs = docs.filter(d => { const x = d.v?.[w[0]]; return w[1] === "==" ? x === w[2] : w[1] === "!=" ? x !== w[2] : w[1] === ">=" ? x >= w[2] : w[1] === "<=" ? x <= w[2] : w[1] === ">" ? x > w[2] : w[1] === "<" ? x < w[2] : true; });
    if (q.order) { const [f, dir] = q.order; docs.sort((a, b) => { const x = a.v?.[f], y = b.v?.[f]; const c = x == null ? -1 : y == null ? 1 : x < y ? -1 : x > y ? 1 : 0; return dir === "desc" ? -c : c; }); }
    if (q.lim) docs = docs.slice(0, q.lim);
    const ds = docs.map(d => docSnap(d.id, d.v)); return { docs: ds, empty: !ds.length, size: ds.length, forEach: f => ds.forEach(f) };
  }
  function query(q) {
    return { orderBy: (f, dir = "asc") => query({ ...q, order: [f, dir] }), limit: n => query({ ...q, lim: n }),
      where: (f, op, v) => query({ ...q, wheres: [...(q.wheres || []), [f, op, v]] }),
      get: async () => runQuery(q),
      onSnapshot(cb, err) { const l = () => { try { cb(runQuery(q)); } catch (e) { err && err(e); } }; listeners.add(l); if (BUNDLE.generated_at || Object.keys(OV).length) queueMicrotask(l); return () => listeners.delete(l); },
      doc: id => docRef(q.coll + "/" + id),
      add: async data => { const id = "a" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); await write(q.coll + "/" + id, "set", data); return docRef(q.coll + "/" + id); } };
  }
  function docRef(path) {
    const [, id] = split(path);
    return { id, path,
      get: async () => docSnap(id, docVal(path)),
      set: d => write(path, "set", d), update: d => write(path, "update", d), delete: () => write(path, "delete"),
      onSnapshot(cb, err) { const l = () => { try { cb(docSnap(id, docVal(path))); } catch (e) { err && err(e); } }; listeners.add(l); if (BUNDLE.generated_at || Object.keys(OV).length) queueMicrotask(l); return () => listeners.delete(l); } };
  }
  const db = { collection: name => query({ coll: name }), doc: docRef,
    batch: () => { const ops = []; return { set: (r, d) => ops.push([r.path, "set", d]), update: (r, d) => ops.push([r.path, "update", d]), delete: r => ops.push([r.path, "delete"]),
      commit: async () => { for (const o of ops) await write(o[0], o[1], o[2]); } }; } };

  let ready; const dbReady = new Promise(r => ready = r);

  /* ---------- bilder og filer (assets) ---------- */
  const HEX = "0123456789abcdef";
  const nyId = () => { const a = new Uint8Array(16); crypto.getRandomValues(a); return [...a].map(b => b.toString(16).padStart(2, "0")).join(""); };
  const ENDELSE = { "image/png": "png", "image/jpeg": "jpg", "image/webp": "webp", "image/gif": "gif", "image/svg+xml": "svg", "application/pdf": "pdf" };
  const assets = {
    async upload(file) {
      if (!file) throw { code: "no_file" };
      if (file.size > 10 * 1024 * 1024) throw { code: "too_large", message: "Filen er større enn 10 MB" };
      const ext = ENDELSE[file.type] || (file.name || "").split(".").pop()?.toLowerCase();
      if (!ext || !/^[a-z0-9]{1,5}$/.test(ext)) throw { code: "unsupported_type" };
      const buf = new Uint8Array(await file.arrayBuffer());
      let bin = ""; const C = 0x8000;
      for (let i = 0; i < buf.length; i += C) bin += String.fromCharCode.apply(null, buf.subarray(i, i + C));
      const id = nyId(), navn = id + "." + ext;
      const r = await gh(`${R}/contents/assets/${navn}`, { method: "PUT", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: "App: nytt bilde " + navn, content: btoa(bin), branch: BRANCH }) });
      if (r.status === 403 || r.status === 401) throw { code: "not_granted", message: "Nøkkelen mangler skrivetilgang" };
      if (!r.ok) throw { code: "upload_failed", message: "GitHub svarte " + r.status };
      const j = await r.json().catch(() => ({}));
      if (j.commit?.sha) META.head = j.commit.sha;
      BUNDLE.assets = { ...(BUNDLE.assets || {}), [id]: navn };     // slik at bildet vises med én gang
      await KV.set("bundle", BUNDLE).catch(() => {});
      save(); postAssets();
      return { id, url: "_blob/" + id, name: navn };
    }
  };
  window.claude = { use: async name => name === "db" ? (await dbReady, db) : name === "assets" ? assets : null };

  /* ---------- skriving ---------- */
  async function write(path, op, data) {
    if (!/^[a-z0-9-]+\/[A-Za-z0-9_.-]+$/.test(path)) throw { code: "bad_path", message: "Ugyldig sti: " + path };
    const cur = docVal(path);
    let next;
    if (op === "delete") next = undefined;
    else if (op === "update") { if (cur === undefined) throw { code: "not_found", message: "Dokumentet finnes ikke" }; next = { ...cur, ...clone(data) }; }
    else next = clone(data);
    putOv(path, next);                                   // vis endringen med en gang
    Q = Q.filter(x => x.path !== path).concat([{ path, op: op === "delete" ? "delete" : "set", data: next === undefined ? null : next, t: now() }]);
    save(); notify(); bar();
    await pump();                                        // feiler det, blir det liggende i køen
    if (lastErr && Q.some(x => x.path === path)) throw { code: "sync", message: lastErr };
  }

  async function shaOf(path) {
    if (OV[path]?.sha) return OV[path].sha;
    const r = await gh(`${R}/contents/${encodeURI(FILE(path))}?ref=${BRANCH}`);
    if (r.status === 404) return null;
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json(); if (OV[path]) OV[path].sha = j.sha; return j.sha;
  }

  async function pushOne(item) {
    const { path, op } = item;
    let sha = await shaOf(path);
    const body = op === "delete"
      ? { message: `App: slett ${path}`, sha, branch: BRANCH }
      : { message: `App: ${sha ? "oppdater" : "ny"} ${path}`, content: b64(JSON.stringify(item.data, null, 1) + "\n"), sha: sha || undefined, branch: BRANCH };
    if (op === "delete" && !sha) return true;            // alt borte fra før
    let r = await gh(`${R}/contents/${encodeURI(FILE(path))}`, { method: op === "delete" ? "DELETE" : "PUT", body: JSON.stringify(body), headers: { "Content-Type": "application/json" } });
    if (r.status === 409 || r.status === 422) {          // noen andre skrev imens: hent fersk sha og prøv én gang til
      if (OV[path]) OV[path].sha = null;
      sha = await shaOf(path);
      body.sha = sha || undefined; if (op === "delete" && !sha) return true;
      r = await gh(`${R}/contents/${encodeURI(FILE(path))}`, { method: op === "delete" ? "DELETE" : "PUT", body: JSON.stringify(body), headers: { "Content-Type": "application/json" } });
    }
    if (r.status === 401) throw Object.assign(new Error("Nøkkelen ble ikke godtatt"), { auth: true });
    if (r.status === 403) throw Object.assign(new Error("Nøkkelen mangler skrivetilgang til repoet"), { auth: true });
    if (!r.ok) throw new Error("GitHub svarte " + r.status);
    const j = await r.json().catch(() => ({}));
    if (OV[path]) OV[path].sha = j.content?.sha || null;
    if (j.commit?.sha) META.head = j.commit.sha;
    return true;
  }

  async function pump() {
    if (saving) return; saving = true; bar();
    try {
      while (Q.length) {
        const item = Q[0];
        try { await pushOne(item); Q.shift(); lastErr = null; save(); }
        catch (e) {
          lastErr = e.message || "Fikk ikke lagret";
          if (e.auth) { await KV.del("token"); token = await gate(lastErr + ". Lag en ny nøkkel med skrivetilgang."); lastErr = null; continue; }
          break;                                          // nett eller GitHub nede: prøv igjen senere
        }
      }
    } finally { saving = false; bar(); }
  }

  /* ---------- lesing og synk ---------- */
  async function bundleCommit() {                       // hvilken commit bundelen ble laget i
    const r = await gh(`${R}/commits?path=bundle/data.json&per_page=1&sha=${BRANCH}`);
    if (!r.ok) return null;
    const j = await r.json().catch(() => []);
    return Array.isArray(j) && j[0] ? j[0].sha : null;
  }
  async function loadBundle() {
    const r = await gh(`${R}/contents/bundle/data.json?ref=${BRANCH}`, { raw: true });
    if (r.status === 404) return false;
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    // Et appskall som er cachet av en gammel service worker kan møte et nyere
    // bundelformat. Da er det tryggere å laste siden på nytt én gang enn å vise
    // tomme samlinger. Flagget i sessionStorage hindrer evig omlasting.
    if (Number(d.schemaVersion || 1) > SKJEMA) {
      let prøvd = false;
      try { prøvd = sessionStorage.getItem("mp-skjema") === String(d.schemaVersion); } catch {}
      try { sessionStorage.setItem("mp-skjema", String(d.schemaVersion)); } catch {}
      if (!prøvd) { location.reload(); return false; }
      lastErr = "Appen er for gammel for dataformatet (" + d.schemaVersion + " mot " + SKJEMA + "). Lukk og åpne appen på nytt.";
      notify(); return false;
    }
    const forrige = BUNDLE.collections || {};
    BUNDLE = { generated_at: d.generated_at || null, collections: d.collections || {}, assets: d.assets || {} };
    // Store samlinger ligger i egne filer (bundle/<navn>.json) slik at den daglige
    // kopien holder seg liten. Feiler en av dem, beholder vi den forrige utgaven
    // i stedet for å vise en tom samling.
    // Hentes parallelt: feed, notater og kort er flere megabyte til sammen.
    await Promise.all((d.ekstra || []).map(async navn => {
      let docs = null;
      try { const rr = await gh(`${R}/contents/bundle/${navn}.json?ref=${BRANCH}`, { raw: true }); if (rr.ok) docs = (await rr.json()).docs || {}; } catch {}
      BUNDLE.collections[navn] = docs || forrige[navn] || {};
    }));
    await KV.set("bundle", BUNDLE);
    const cut = BUNDLE.generated_at || "";
    for (const [p, o] of Object.entries(OV)) if (o.t < cut && !Q.some(x => x.path === p)) delete OV[p];   // bundelen har tatt den igjen
    return true;
  }
  async function applyFiles(files) {
    for (const f of files) {
      const m = /^data\/([a-z0-9-]+)\/([^/]+)\.json$/.exec(f.filename || "");
      if (!m) continue;
      const path = m[1] + "/" + m[2];
      if (Q.some(x => x.path === path)) continue;         // vår egen endring venter, ikke overskriv den
      if (f.status === "removed") { OV[path] = { d: null, t: now(), sha: null }; continue; }
      const r = await gh(`${R}/contents/${encodeURI(FILE(path))}?ref=${BRANCH}`, { raw: true });
      if (!r.ok) continue;
      try { OV[path] = { d: await r.json(), t: now(), sha: f.sha || null }; } catch {}
    }
  }
  async function pull() {
    const hr = await gh(`${R}/commits/${BRANCH}`);
    if (hr.status === 401 || hr.status === 403) { await KV.del("token"); token = await gate(hr.status === 401 ? "Nøkkelen er utløpt eller trukket tilbake." : "Nøkkelen har ikke tilgang til repoet."); return pull(); }
    if (!hr.ok) throw new Error("HTTP " + hr.status);
    const head = (await hr.json()).sha;
    if (head === META.head && BUNDLE.generated_at) return;
    let done = false;
    if (META.head && BUNDLE.generated_at) {
      const cr = await gh(`${R}/compare/${META.head}...${head}`);
      if (cr.ok) { const c = await cr.json();
        if (!c.files || c.files.length <= 300) {
          if ((c.files || []).some(f => /^bundle\/[a-z0-9-]+\.json$/.test(f.filename || ""))) await loadBundle();
          await applyFiles(c.files || []); done = true;
        } }
    }
    if (!done) {
      // Bundelen kan være eldre enn siste commit, for eksempel rett etter at en annen
      // enhet har skrevet. Sett utgangspunktet til bundelens egen commit og hent
      // resten som vanlig delta, ellers hadde vi hoppet over de nyeste endringene.
      await loadBundle();
      const bc = await bundleCommit();
      META.head = bc || head;
      if (bc && bc !== head) {
        const cr = await gh(`${R}/compare/${bc}...${head}`);
        if (cr.ok) { const c = await cr.json(); if (!c.files || c.files.length <= 300) await applyFiles(c.files || []); }
      }
    }
    META.head = head; save(); notify(); postAssets();
  }

  /* ---------- statuslinje og innstillinger ---------- */
  const css = `.mpbar{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;gap:6px;align-items:center;font:12px/1.2 var(--f-mono,monospace);background:var(--surface,#fff);color:var(--muted,#666);border:1px solid var(--line,#ddd);border-radius:999px;padding:6px 10px;box-shadow:0 2px 10px rgba(0,0,0,.08);cursor:pointer}
.mpbar i{width:7px;height:7px;border-radius:50%;background:var(--ok,#1f8a4c)}.mpbar.old i{background:var(--warn,#b26a00)}.mpbar.err i{background:var(--accent,#d7262e)}.mpbar.busy i{background:var(--warn,#b26a00);animation:mppulse 1s infinite}
@keyframes mppulse{50%{opacity:.3}}
.mpgate{position:fixed;inset:0;z-index:60;background:var(--bg,#f3f2f0);color:var(--fg,#111);overflow:auto;padding:max(24px,env(safe-area-inset-top)) 16px 32px}
.mpgate .in{max-width:520px;margin:0 auto;display:grid;gap:14px}.mpgate h1{font:800 26px/1.15 var(--f-display,sans-serif);margin:8px 0 0}
.mpgate ol{margin:0;padding-left:20px;display:grid;gap:6px}.mpgate input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line,#ccc);background:var(--surface,#fff);font:14px var(--f-mono,monospace)}
.mpgate .row{display:flex;gap:8px;flex-wrap:wrap}.mpgate .e{color:var(--accent,#d7262e);font-weight:600;min-height:1.2em}\n.mptab{width:100%;border-collapse:collapse;font-size:13px}.mptab td,.mptab th{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line,#e5e5e5);vertical-align:top}.mptab th{font-weight:600;color:var(--muted,#666);font-size:12px}.mptab .t{font-family:var(--f-mono,monospace);white-space:nowrap}.mpgate code{font-size:13px}`;
  const st = document.createElement("style"); st.textContent = css; document.head.appendChild(st);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmt = iso => { if (!iso) return "–"; const d = new Date(iso); return isNaN(d) ? "–" : d.toLocaleString("nb-NO", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }); };
  const old = () => BUNDLE.generated_at && Date.now() - new Date(BUNDLE.generated_at) > 36 * 3600e3;
  let el;
  function bar() {
    if (!el) { el = document.createElement("button"); el.className = "mpbar"; el.type = "button"; el.onclick = settings; document.body.appendChild(el); }
    let cls = old() ? "old" : "", txt = "Data " + fmt(BUNDLE.generated_at);
    if (Q.length && saving) { cls = "busy"; txt = "Lagrer" + (Q.length > 1 ? " " + Q.length : "") + "…"; }
    else if (Q.length) { cls = "err"; txt = Q.length + " venter på nett"; }
    el.className = "mpbar " + cls; el.innerHTML = `<i></i><span>${esc(txt)}</span>`;
  }

  function gate(msg) {
    return new Promise(resolve => {
      const g = document.createElement("div"); g.className = "mpgate"; g.setAttribute("role", "dialog"); g.setAttribute("aria-label", "Koble til data");
      g.innerHTML = `<div class="in"><h1>Morgenpuls</h1>
        <p>Appen leser og lagrer dataene dine i det private repoet <b>${OWNER}/${REPO}</b>. Lim inn den personlige nøkkelen din fra GitHub én gang på denne enheten.</p>
        <p class="e" id="mpe">${esc(msg || "")}</p>
        <label for="mptok"><b>Nøkkel</b> (starter med <code>github_pat_</code>)</label>
        <input id="mptok" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="github_pat_…">
        <div class="row"><button class="btn primary" id="mpgo" type="button">Koble til</button></div>
        <p class="muted" style="font-size:13px">Nøkkelen lagres bare på denne enheten og sendes bare til api.github.com. Den skal gjelde <b>kun</b> repoet ${REPO}, med <b>Contents: Read and write</b>. Da kan du skrive i appen, og det du skriver havner i repoet.</p></div>`;
      document.body.appendChild(g);
      const go = async () => { const t = g.querySelector("#mptok").value.trim(); const e = g.querySelector("#mpe");
        if (!/^(github_pat_|ghp_)[A-Za-z0-9_]{20,}$/.test(t)) { e.textContent = "Det ser ikke ut som en GitHub-nøkkel."; return; }
        e.textContent = "Sjekker…";
        try { const r = await fetch(API + R, { headers: { Authorization: "Bearer " + t, Accept: "application/vnd.github+json" }, cache: "no-store" });
          if (r.status === 401) { e.textContent = "GitHub godtok ikke nøkkelen."; return; }
          if (r.status === 404 || r.status === 403) { e.textContent = "Nøkkelen har ikke tilgang til repoet " + REPO + "."; return; }
          if (!r.ok) { e.textContent = "GitHub svarte " + r.status + ". Prøv igjen."; return; }
          const j = await r.json();
          if (j.permissions && j.permissions.push === false) { e.textContent = "Nøkkelen kan bare lese. Den må ha Contents: Read and write for at du skal kunne skrive i appen."; return; }
          await KV.set("token", t); token = t; g.remove(); resolve(t);
        } catch { e.textContent = "Fikk ikke kontakt med GitHub. Sjekk nettet."; } };
      g.querySelector("#mpgo").onclick = go; g.querySelector("#mptok").addEventListener("keydown", ev => { if (ev.key === "Enter") go(); });
      setTimeout(() => g.querySelector("#mptok").focus(), 50);
    });
  }

  function dager(n) {                                   // de n siste dagene med status per kilde
    const ut = [];
    for (let i = 0; i < n; i++) {
      const d = new Date(Date.now() - i * 864e5);
      const key = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
      const f = docVal("feed/" + key), m = docVal("ma36/" + key);
      ut.push({ dato: key, feed: !!f, finans: f?.finance?.status || null,
        nyheter: f?.world?.items?.length || 0, helse: f?.health?.status || null,
        ma36: !!m, etterslep: !!f?.etterslep });
    }
    return ut;
  }
  const prikk = ok => `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${ok === true ? "var(--ok,#1f8a4c)" : ok === false ? "var(--accent,#d7262e)" : "var(--warn,#b26a00)"}"></span>`;

  function settings() {
    const g = document.createElement("div"); g.className = "mpgate";
    const st = docVal("system/status") || {};
    const kilder = Object.entries(st).filter(([k, v]) => v && typeof v === "object" && v.sist)
      .sort((a, b) => a[0].localeCompare(b[0]));
    const navn = { "36ma": "36MA-status", pubmed: "PubMed", meldinger: "Selskapsmeldinger", arkiv: "Ukentlig arkiv", morgen: "Morgenkjøring" };
    const d = dager(10);
    const rader = kilder.map(([k, v]) => {
      const gml = Date.now() - new Date(v.sist) > 36 * 3600e3;
      return `<tr><td>${prikk(v.status === "ok" ? (gml ? null : true) : false)} ${esc(navn[k] || k)}</td>
        <td class="t">${esc(fmt(v.sist))}</td><td class="muted">${esc(v.note || "")}</td></tr>`;
    }).join("") || `<tr><td colspan="3" class="muted">Ingen kjøringer har meldt fra ennå.</td></tr>`;
    const dagrader = d.map(x => `<tr><td class="t">${esc(x.dato.slice(8) + "." + x.dato.slice(5, 7))}</td>
      <td>${prikk(x.finans === "ok" ? true : x.feed ? null : false)}</td>
      <td>${prikk(x.nyheter > 0 ? true : x.feed ? null : false)}</td>
      <td>${prikk(x.helse === "ok" ? true : x.helse === "venter" ? null : x.helse ? null : false)}</td>
      <td>${prikk(x.ma36 ? true : null)}</td>
      <td class="muted">${x.etterslep ? "hentet i etterkant" : ""}</td></tr>`).join("");
    g.innerHTML = `<div class="in"><h1>Status</h1>
      <p class="muted" style="font-size:13px;margin:0">Alt lagres i ditt private GitHub-repo. Appen skriver direkte dit, og kjøringene legger på innhold.</p>
      <p><b>Denne enheten</b><br><span class="muted" style="font-size:13px">${Q.length ? esc(Q.length + " endring(er) venter på nett. De ligger trygt lagret her til nettet er tilbake.") : "Alt er lagret."}${lastErr ? " Siste feil: " + esc(lastErr) : ""}<br>Siste store kopi: ${esc(fmt(BUNDLE.generated_at))}.</span></p>
      <div class="row"><button class="btn primary" id="mpref" type="button">Hent på nytt</button>${Q.length ? '<button class="btn" id="mpq" type="button">Prøv å lagre nå</button>' : ""}<button class="btn" id="mpny" type="button">Bytt nøkkel</button><button class="btn" id="mpx" type="button">Lukk</button></div>
      <p><b>Kildene</b></p>
      <table class="mptab"><tbody>${rader}</tbody></table>
      <p><b>Siste ti dager</b><br><span class="muted" style="font-size:13px">Finans, nyheter, helse og 36MA. Grått betyr at det venter eller mangler.</span></p>
      <table class="mptab"><thead><tr><th>Dag</th><th>Fin</th><th>Nyh</th><th>Hel</th><th>36MA</th><th></th></tr></thead><tbody>${dagrader}</tbody></table>
      <hr style="border:0;border-top:1px solid var(--line,#ddd);width:100%">
      <p><b>Fjern alt fra denne enheten</b><br><span class="muted" style="font-size:13px">Sletter nøkkelen og alt som er lagret lokalt, og henter alt på nytt neste gang. Repoet påvirkes ikke. Endringer som ikke er lagret ennå, går tapt.</span></p>
      <div class="row"><button class="btn" id="mpdel" type="button" style="color:var(--accent,#d7262e)">Fjern nøkkel og data</button></div></div>`;
    document.body.appendChild(g);
    g.querySelector("#mpx").onclick = () => g.remove();
    g.querySelector("#mpref").onclick = async () => { g.remove(); await refresh(); };
    const qb = g.querySelector("#mpq"); if (qb) qb.onclick = async () => { g.remove(); await pump(); };
    g.querySelector("#mpny").onclick = async () => { g.remove(); await KV.del("token").catch(() => {}); token = await gate("Lim inn den nye nøkkelen. Alt du har lagret lokalt beholdes."); postAssets(); await refresh(); };
    g.querySelector("#mpdel").onclick = async () => { for (const k of ["token", "bundle", "ov", "meta", "queue"]) await KV.del(k).catch(() => {}); try { await caches.delete("mp-assets"); } catch {} location.reload(); };
  }

  function postAssets() { navigator.serviceWorker?.controller?.postMessage({ type: "cfg", token, assets: BUNDLE.assets || {} }); }

  async function refresh() {
    try { await pull(); await pump(); lastErr = null; }
    catch (e) { lastErr = e.message || String(e); }
    bar();
  }

  async function start() {
    if ("serviceWorker" in navigator) {
      try { await navigator.serviceWorker.register("sw.js"); } catch {}
      navigator.serviceWorker.addEventListener("message", e => { if (e.data?.type === "need-cfg") postAssets(); });
      navigator.serviceWorker.addEventListener("controllerchange", postAssets);
    }
    token = await KV.get("token").catch(() => null);
    if (!token) token = await gate();
    BUNDLE = (await KV.get("bundle").catch(() => null)) || BUNDLE;
    OV = (await KV.get("ov").catch(() => null)) || Object.create(null);
    META = (await KV.get("meta").catch(() => null)) || { head: null };
    Q = (await KV.get("queue").catch(() => null)) || [];
    if (BUNDLE.generated_at || Object.keys(OV).length) { ready(); notify(); postAssets(); }
    bar();
    await refresh();
    ready();
    notify();
    addEventListener("online", () => refresh());
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refresh(); });
  }
  /* ---------- versjonshistorikk fra git ---------- */
  async function historikk(path, antall = 20) {
    const r = await gh(`${R}/commits?path=${encodeURIComponent(FILE(path))}&per_page=${antall}&sha=${BRANCH}`);
    if (!r.ok) throw new Error("Fikk ikke historikken (" + r.status + ")");
    const j = await r.json();
    return (Array.isArray(j) ? j : []).map(c => ({
      sha: c.sha, når: c.commit?.committer?.date || c.commit?.author?.date,
      hvem: c.commit?.author?.name || "", hva: (c.commit?.message || "").split("\n")[0] }));
  }
  async function hentVersjon(path, sha) {
    const r = await gh(`${R}/contents/${encodeURI(FILE(path))}?ref=${sha}`, { raw: true });
    if (!r.ok) throw new Error("Fikk ikke den versjonen (" + r.status + ")");
    return r.json();
  }
  async function gjenopprett(path, sha) { const d = await hentVersjon(path, sha); await write(path, "set", d); return d; }

  window.__mp = { refresh, pump, pull, historikk, hentVersjon, gjenopprett,
    state: () => ({ head: META.head, bundle: BUNDLE.generated_at, kø: Q.length, overlay: Object.keys(OV).length, feil: lastErr }) };

  for (const x of S.sovn || []) if (x.dag) (per[x.dag] = per[x.dag] || {dag: x.dag}).sovn = x.minutter || null;
  for (const x of S.form || []) if (x.dag) { const o = (per[x.dag] = per[x.dag] || {dag: x.dag}); o.hrv = x.hrv || null; o.bb = x.body_battery || null; }
  for (const x of S.gdag || []) if (x.dag && (x.bb_maks != null || x.bb_min != null)) { const o = (per[x.dag] = per[x.dag] || {dag: x.dag}); o.bb = Object.assign({}, o.bb, {hoy: x.bb_maks ?? o.bb?.hoy, lav: x.bb_min ?? o.bb?.lav}); }

function miniChart(vals, o = {}){

  vals.forEach((v, i) => { if (v == null) { pen = false; return; } d += (pen ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1); pen = true; });

const snitt = a => { const v = a.filter(x => x != null); return v.length ? v.reduce((p, c) => p + c, 0) / v.length : null; };

function dagsform(){
  const d = formDager(14), siste = d[d.length - 1];
  const del = [];
  const sovn = [...d].reverse().find(x => x.sovn);
  if (sovn) del.push("sov " + fmtT(sovn.sovn));
  const hrv = [...d].reverse().find(x => x.hrv?.natt_snitt != null);
  if (hrv) {
    const h = hrv.hrv, lav = h.baseline_lav, hoy = h.baseline_hoy;
    const rel = lav != null && hoy != null ? (h.natt_snitt < lav ? ", under normalområdet" : h.natt_snitt > hoy ? ", over normalområdet" : ", innenfor normalområdet") : "";
    del.push("HRV " + Math.round(h.natt_snitt) + " ms" + rel);

  if (bb) del.push("Body Battery høyest " + Math.round(bb.bb.hoy));
  if (S.sri && S.sri.sri != null && !S.sri.mistenkelig) del.push("søvnregularitet " + S.sri.sri.toFixed(0));

  const igaar = new Date(Date.parse(osloDate() + "T12:00:00Z") - 864e5).toISOString().slice(0, 10), dn = dayNum(igaar);
  const sjekk = [];
  const rep = (S.rlog?.maaned === igaar.slice(0, 7)) ? (S.rlog.rader || []).some(r => r.d === dn) : null;
  if (rep !== null) sjekk.push(["kort", rep]);

}

/* Garmin-dagstall (dag-<dato>) og søvnmål (sovnmaal-<dato>) lagres av tools/garmin.py.

const mandagAv = d => { const t = new Date(d + "T12:00:00Z"); t.setUTCDate(t.getUTCDate() - ((t.getUTCDay() + 6) % 7)); return t.toISOString().slice(0, 10); };

/* ---------- handleliste fra oppskriftene ---------- */
const ENHET = {g: "g", gram: "g", kg: "kg", dl: "dl", l: "l", liter: "l", ml: "ml", cl: "cl", ss: "ss", ts: "ts", stk: "stk", pk: "pk", pakke: "pk", boks: "boks", fedd: "fedd", klype: "klype", neve: "neve", skive: "skiver", skiver: "skiver", bunt: "bunt", pose: "pose", glass: "glass", bit: "biter", biter: "biter"};
const BRK = {"½": 0.5, "¼": 0.25, "¾": 0.75, "⅓": 1 / 3, "⅔": 2 / 3};
function parseIng(s){
  let t = String(s || "").trim().replace(/^[-•*·]\s*/, "").replace(/\s+/g, " ");
  if (!t) return null;
  let mengde = null, rest = t;
  const brok = x => /^\d+\/\d+$/.test(x) ? Number(x.split("/")[0]) / Number(x.split("/")[1]) : BRK[x] ?? null;
  const toks = t.split(" ");
  let i = 0, sum = 0, fant = false;
  // 1, 1,5, 1/2, ½, 1 1/2, 1½ og intervall som 2-3 (øvre grense)
  for (; i < toks.length; i++) {
    let x = toks[i].replace(",", ".");
    if (/^\d+(\.\d+)?-\d+(\.\d+)?$/.test(x)) { sum += Number(x.split("-")[1]); fant = true; i++; break; }
    if (/^\d+(\.\d+)?$/.test(x)) { if (fant && sum % 1 !== 0) break; sum += Number(x); fant = true; continue; }
    if (/^\d+[½¼¾⅓⅔]$/.test(x)) { sum += Number(x.slice(0, -1)) + BRK[x.slice(-1)]; fant = true; i++; break; }
    const b = brok(x); if (b !== null && !/^\d+\.\d+$/.test(x)) { sum += b; fant = true; i++; break; }
    break;
  }
  if (fant) { mengde = sum; rest = toks.slice(i).join(" "); }
  let enhet = null;
  const m = rest.match(/^([a-zæøåA-ZÆØÅ]+)\.?\s+(.*)$/);
  if (mengde !== null && m && ENHET[m[1].toLowerCase()]) { enhet = ENHET[m[1].toLowerCase()]; rest = m[2]; }
  else if (mengde !== null) { const m2 = rest.match(/^([a-zæøåA-ZÆØÅ]+)$/); if (m2 && ENHET[m2[1].toLowerCase()]) { enhet = ENHET[m2[1].toLowerCase()]; rest = ""; } }
  rest = rest.replace(/^(av|of)\s+/i, "").trim();
  const navn = rest.split(",")[0].trim().toLowerCase().replace(/\s+/g, " ");
  return {mengde, enhet, navn: navn || t.toLowerCase(), rest: rest || t};
}
function normEnhet(m, e){
  if (m == null) return [null, e];
  if (e === "kg") return [m * 1000, "g"];
  if (e === "l") return [m * 1000, "ml"];
  if (e === "dl") return [m * 100, "ml"];
  if (e === "cl") return [m * 10, "ml"];
  return [m, e];
}
function visMengde(m, e){
  if (m == null) return "";
  if (e === "g") return m >= 1000 ? (m / 1000).toLocaleString("nb-NO", {maximumFractionDigits: 2}) + " kg" : Math.round(m) + " g";
  if (e === "ml") return m >= 1000 ? (m / 1000).toLocaleString("nb-NO", {maximumFractionDigits: 2}) + " l" : m >= 100 && m % 100 === 0 ? (m / 100) + " dl" : Math.round(m) + " ml";
  return Number(m.toFixed(2)).toLocaleString("nb-NO") + (e ? " " + e : "");
}
function handleliste(valg){
  // valg: [{ingredienser: [..], faktor}]. Samme vare og enhet slås sammen.
  const per = new Map();
  for (const v of valg) for (const linje of v.ingredienser || []) {
    const p = parseIng(linje); if (!p) continue;
    const [m, e] = normEnhet(p.mengde !== null ? p.mengde * v.faktor : null, p.enhet);
    const nokkel = p.navn + "|" + (e || "");
    const x = per.get(nokkel) || {navn: p.navn, enhet: e, mengde: null, antall: 0, tekst: p.rest};
    if (m !== null) x.mengde = (x.mengde || 0) + m;
    x.antall++;
    per.set(nokkel, x);
  }
  return [...per.values()].sort((a, b) => a.navn.localeCompare(b.navn, "nb")).map(x => ({...x, vis: (visMengde(x.mengde, x.enhet) + " " + x.navn).trim(), nokkel: x.navn + "|" + (x.enhet || "")}));
}
function vHandle(){
  const valgt = new Set(S.shopSel || []), ferdig = new Set(S.shopDone || []);
  const grunn = r => { const n = parseFloat(String(r.servings || "").replace(",", ".")); return n > 0 ? n : null; };
  const faktorer = S.shopPort || {};

      <span class="lt row" style="gap:10px;align-items:center"><input type="checkbox" data-shopsel="${esc(r.id)}" ${valgt.has(r.id) ? "checked" : ""} aria-label="Ta med ${esc(r.title || "oppskriften")}">${valgt.has(r.id) && grunn(r) ? `<input class="txt" style="width:70px" type="number" min="1" max="50" step="1" data-shopport="${esc(r.id)}" value="${esc(String(faktorer[r.id] || grunn(r)))}" aria-label="Porsjoner"><span class="muted" style="font-size:12px">porsjoner</span>` : ""}</span></label>`).join("")}</div>` : `<p class="muted">Ingen oppskrifter ennå.</p>`}</div>

      <p class="muted" style="font-size:12px;margin:0">Mengder med samme vare og enhet er slått sammen, og dl, cl og l regnes om til ml. Linjer uten mengde (som «salt») står som de er. Sjekk alltid mot det du har hjemme.</p></div>` : ""}`;

/* Ukesdebrief. Tannenbaum og Cerasolis metaanalyse (31 studier, N = 2 136) ga

/* n-of-1. Tildelingen regnes ut en gang, her, fra et lagret froe, og den vises
   bare til og med i dag. Da kan den ikke endres underveis, og du kan ikke se
   morgendagens betingelse og tilpasse deg den. Analysen gjoeres i kode av
   tools/eksperiment.py, ikke her: det er ett riktig svar, og da skal det ikke
   finnes to implementasjoner av det. */
function froeRekke(froe, dager){
  // Samme parvise balansering som i Python: hvert par inneholder en A og en B.
  let x = froe >>> 0; const rnd = () => (x = (x * 1664525 + 1013904223) >>> 0) / 4294967296;
  const ut = [];
  for (let i = 0; i < Math.ceil(dager / 2); i++) ut.push(...(rnd() < 0.5 ? ["A","B"] : ["B","A"]));
  return ut.slice(0, dager);
}

  const iGang = idx >= 0 && idx < (e.tildeling || []).length;
  const dagens = iGang ? e.tildeling[idx] : null;
  const logget = (e.logg || []).find(r => r.dato === idag);
  const a = e.analyse;
  const navn = k => k === "A" ? (e.a_navn || "A") : (e.b_navn || "B");
  return `<div class="stack">

function vStudier(){

  const tot = order.reduce((a,k) => a + (counts[k]||0), 0), all = h?.items || [];
  const big = s => (participants(s) || 0) >= 300;
  // Prioritering: studiene som hoerer til temaene dine og det du foelger legges
  // oeverst. Dette skjer i koden, ikke i AI-en: regel med ett riktig svar.
  const folgOrd = (S.config?.health_follow || []).map(f => String(f.label || "").toLowerCase()).filter(Boolean);
  const folgTreff = s => { const t = [s.title, s.summary, (s.themes || []).join(" "), s.theme].join(" ").toLowerCase(); return folgOrd.filter(o => o && t.includes(o)); };
  const prioritet = s => themesOf(s).length * 2 + (folgTreff(s).length ? 3 : 0) + (s.type === "RCT" ? 1.5 : s.type === "Oversikt" ? 1 : 0) + (big(s) ? 1 : 0);
  const items = all.filter(s => (!S.hType || s.type === S.hType) && (!S.hTheme || themesOf(s).includes(S.hTheme)) && (!S.hBig || big(s)))
    .map((s, i) => ({s, i, p: prioritet(s)})).sort((a, b) => b.p - a.p || a.i - b.i).map(x => x.s);
  const nBig = all.filter(s => big(s) && (!S.hType || s.type === S.hType) && (!S.hTheme || themesOf(s).includes(S.hTheme))).length;
  const nTheme = label => all.filter(s => themesOf(s).includes(label) && (!S.hType || s.type === S.hType) && (!S.hBig || (participants(s) || 0) >= 300)).length;
  const nType = k => all.filter(s => s.type === k && (!S.hTheme || themesOf(s).includes(S.hTheme))).length;

  const filtered = S.hType || S.hTheme || S.hBig;
  return `
  <div class="panel">
    <div class="hhead"><span class="pmlogo">PubMed</span><div class="count"><div class="big tnum">${h?.total ?? "–"}</div><div class="muted" style="font-size:13px">nye studier ${esc(h?.window || "siste døgn")}</div></div></div>
    ${tot ? `<div class="segbar" role="img" aria-label="Fordeling på studietype">${order.filter(k => counts[k]).map(k => `<i style="flex:${counts[k]};background:${TYPES[k].c};opacity:${S.hType && S.hType !== k ? .3 : 1}"></i>`).join("")}</div>
    <div class="legend">${order.filter(k => counts[k]).map(k => `<button class="lg ${S.hType === k ? "sel" : ""} ${S.hType && S.hType !== k ? "dim" : ""}" data-htype="${k}" aria-pressed="${S.hType === k}" title="${nType(k)} av dem vises under"><i style="background:${TYPES[k].c}"></i>${TYPES[k].l} <b>${counts[k]}</b></button>`).join("")}</div>` : ""}
    <div class="stack" style="margin-top:18px"><div class="spread"><span class="eyebrow">Dine temaer</span><button class="btn small ghost" id="edthemes">${S.editThemes ? "Ferdig" : "Endre"}</button></div>
      <div class="chips">${chipHtml || `<span class="muted">Ingen temaer valgt.</span>`}</div>
      ${S.editThemes ? "" : `<div class="row" style="gap:8px"><span class="eyebrow">Hurtigfilter</span><button class="chip ${S.hBig ? "sel" : ""}" data-hbig="1" aria-pressed="${!!S.hBig}">300+ deltakere<span class="cnt tnum">${nBig}</span></button></div>`}
      ${S.editThemes ? `<form id="addtheme" class="row"><input id="themein" class="txt" style="flex:1;min-width:160px" placeholder="Nytt tema, f.eks. Søvn eller Kreatin" maxlength="60"><button class="btn small">Legg til</button></form><p class="muted" style="font-size:13px">Endringer brukes fra neste morgenoppdatering.</p>` : `<p class="muted" style="font-size:13px">Trykk på et tema eller en studietype for å filtrere.</p>`}
    </div>
  </div>
  ${followPanel(h)}
  ${filtered ? `<div class="spread"><span class="muted" style="font-size:14px">Viser ${items.length} av ${all.length} utvalgte studier${S.hTheme ? ` · ${esc(S.hTheme)}` : ""}${S.hType ? ` · ${esc(TYPES[S.hType].l)}` : ""}${S.hBig ? " · 300+ deltakere" : ""}</span><button class="btn small" id="hreset">Vis alle</button></div>` : ""}
  ${items.length ? items.map(studyCard).join("") : (all.length ? `<div class="empty"><b>Ingen av dagens utvalgte studier passer filteret.</b><br>Tallene øverst gjelder alle treff denne uka, listen viser bare et utvalg.</div>` : emptyFeed("studier"))}

/* ---------- 36MA-status (NorthStar-lesing) ---------- */
const MA_TF = [["d", "Dag", "handelsdager", "handelsdag"], ["m", "Måned", "måneder", "måned"], ["q", "Kvartal", "kvartaler", "kvartal"]];
const maCls = s => s === "gronn" || s === "gronn-flat" ? "g" : s === "rod" || s === "rod-flat" ? "r" : s === "gul" ? "y" : "n";
const maTxt = {gronn: "Over, stiger", "gronn-flat": "Over, flatt snitt", gul: "Blandet", "rod-flat": "Under, flatt snitt", rod: "Under, faller", kort: "For kort historikk"};
const trendArrow = t => t === "stiger" ? "↗" : t === "faller" ? "↘" : t === "flat" ? "→" : "";
const maNf = (x, d = 1) => x == null || !isFinite(x) ? "–" : Number(x).toLocaleString("nb-NO", {maximumFractionDigits: d, minimumFractionDigits: 0});
const maPx = x => x == null ? "–" : Number(x).toLocaleString("nb-NO", {maximumSignificantDigits: 4});
const maSgn = x => x == null ? "–" : (x > 0 ? "+" : x < 0 ? "−" : "") + maNf(Math.abs(x)) + " %";
function maChip(t){
  if (!t) return `<span class="mac n">–</span>`;
  if (t.status === "kort") return `<span class="mac n" title="${esc(t.bars + " av 36")}">${esc(t.bars)}/36</span>`;
  return `<span class="mac ${maCls(t.status)}" title="${esc(maTxt[t.status] || "")}"><b>${t.above ? "Over" : "Under"}</b><span class="tnum">${maSgn(t.dist)}</span><i aria-hidden="true">${trendArrow(t.trend)}</i></span>`;
}
const maRsiCls = v => v == null ? "" : v >= 75 ? "r" : v >= 65 ? "y" : "";
function maRsi(t, long){
  if (!t || t.rsi == null) return "";
  const c = maRsiCls(t.rsi), tip = c === "r" ? "RSI 75 eller høyere" : c === "y" ? "RSI mellom 65 og 75" : "RSI under 65";
  return `<span class="marsi ${c}" title="${tip}">${long ? "RSI 14: " : "RSI "}<b class="tnum">${maNf(t.rsi, 1)}</b></span>`;
}
const MA_SORTS = {d: "Dag", m: "Måned", q: "Kvartal"};
function maSortVal(r, k){ const t = r[k]; return r.error || !t || t.status === "kort" || t.dist == null ? null : t.dist; }
function maSort(items){
  const {k, dir} = S.maSort || (S.maSort = {k: "q", dir: -1});
  return items.slice().sort((a, b) => { const x = maSortVal(a, k), y = maSortVal(b, k);
    if (x == null && y == null) return String(a.name).localeCompare(String(b.name), "nb");

function cardsAll(deck){
  const set = LD(deck)?.settings || defaultSettings(deck), out = [];
  if (deck === "hist") { for (const c of S.hist || []) if (!set.cats?.length || set.cats.includes(c.cat)) out.push("h:" + c.id); return out; }
  if (deck === "vg3") { for (const c of (S.vg3Cards || []).slice().sort((a,b) => (a.n || 0) - (b.n || 0))) out.push("v:" + c.id); return out; }
  if (deck === "own") { for (const c of (S.ownCards || []).slice().sort((a,b) => String(a.created_at || "").localeCompare(String(b.created_at || "")))) out.push("o:" + c.id); return out; }
  for (const c of S.geo || []) {
    if (set.regions?.length && !c.tags.some(t => set.regions.includes(t))) continue;
    if (set.types.flag && c.hasFlag) out.push("flag:" + c.id);
    if (set.types.map && c.hasMap) out.push("map:" + c.id);
    if (set.types.cap && c.cap) out.push("cap:" + c.id);
    if (set.types.capq && c.cap) out.push("capq:" + c.id);
  }
  return out;
}

  const maxF = Math.max(0, ...played), base = maxF > 4 ? Math.min(...played) : 1;
  const W = 120, H = 140, x0 = 18, dx = 17, y0 = 28, dy = 22;
  let s = `<svg viewBox="0 0 ${W} ${H}" class="chordsvg" role="img" aria-label="Akkordgrep ${esc(shape)}">`;
  for (let i = 0; i < 6; i++) s += `<line x1="${x0 + i * dx}" y1="${y0}" x2="${x0 + i * dx}" y2="${y0 + dy * 5}" stroke="var(--muted)" stroke-width="1.2"/>`;
  for (let j = 0; j <= 5; j++) s += `<line x1="${x0}" y1="${y0 + j * dy}" x2="${x0 + dx * 5}" y2="${y0 + j * dy}" stroke="${j === 0 && base === 1 ? "var(--fg)" : "var(--muted)"}" stroke-width="${j === 0 && base === 1 ? 4 : 1.2}"/>`;
  if (base > 1) s += `<text x="${x0 + dx * 5 + 6}" y="${y0 + dy * .7}" font-size="11" font-family="IBM Plex Mono, monospace" fill="var(--muted)">${base}</text>`;
  frets.forEach((f, i) => { const x = x0 + i * dx;
    if (f < 0) s += `<text x="${x}" y="${y0 - 9}" font-size="12" text-anchor="middle" fill="var(--muted)">×</text>`;
    else if (f === 0) s += `<circle cx="${x}" cy="${y0 - 13}" r="4.5" fill="none" stroke="var(--fg)" stroke-width="1.4"/>`;
    else s += `<circle cx="${x}" cy="${y0 + (f - base + .5) * dy}" r="6.5" fill="var(--fg)"/>`; });
  return s + `</svg>`;
}

/* dagens huskestue (Trivial Pursuit-format) */
function wedges(){
  const f = feed(), qs = f?.trivia || [], ans = S.tpDoc?.answers || {};
  const r = 34, cx = 40, cy = 40; let paths = "";
  TP.forEach((t, i) => {
    const qi = qs.findIndex(q => String(q.cat).toLowerCase() === t.k.toLowerCase());
    const won = qi >= 0 && ans[qi] !== undefined && Number(ans[qi]) === Number(qs[qi].answer);
    const a0 = (i * 60 - 90) * Math.PI / 180, a1 = ((i + 1) * 60 - 90) * Math.PI / 180;
    const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0), x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    paths += `<path d="M${cx},${cy} L${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 0 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z" fill="${won ? t.c : "var(--surface-2)"}" stroke="var(--surface)" stroke-width="2"/>`;
  });
  return `<svg width="80" height="80" viewBox="0 0 80 80" role="img" aria-label="Kakebiter vunnet i dag"><circle cx="40" cy="40" r="37" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>${paths}</svg>`;
}
function learnTp(){

function sparkline(points, w = 520, h = 150){
  if (!points || points.length < 2) return "";
  const ys = points.map(p => p.eq), min = Math.min(...ys), max = Math.max(...ys), pad = (max - min) * .12 || 1, lo = min - pad, hi = max + pad;
  const X = i => 8 + i * (w - 16) / (points.length - 1), Y = v => h - 18 - (v - lo) / (hi - lo) * (h - 30);
  const line = points.map((p, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(p.eq).toFixed(1)}`).join("");
  const area = line + `L${X(points.length - 1).toFixed(1)},${h - 18}L${X(0).toFixed(1)},${h - 18}Z`;
  const last = points[points.length - 1], first = points[0];
  return `<svg viewBox="0 0 ${w} ${h}" class="spark" role="img" aria-label="Egenkapital fra ${esc(first.d)} til ${esc(last.d)}">
    <line x1="8" x2="${w - 8}" y1="${Y(10000).toFixed(1)}" y2="${Y(10000).toFixed(1)}" stroke="var(--line)" stroke-dasharray="3 4"/>
    <path d="${area}" fill="var(--accent)" opacity=".1"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    <circle cx="${X(points.length - 1).toFixed(1)}" cy="${Y(last.eq).toFixed(1)}" r="4" fill="var(--accent)"/>
    <text x="8" y="${h - 3}" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${esc(first.d)}</text>
    <text x="${w - 8}" y="${h - 3}" font-size="11" fill="var(--muted)" text-anchor="end" font-family="IBM Plex Mono, monospace">${esc(last.d)}</text>
    <text x="${w - 8}" y="${(Y(10000) - 4).toFixed(1)}" font-size="10" fill="var(--muted)" text-anchor="end" font-family="IBM Plex Mono, monospace">start $10 000</text></svg>`;
}
/* ---------- Risikobildet og stoerrelsesberegning ----------
   Tallene kommer ferdig regnet fra tools/risiko.py. Her regnes bare kandidaten,
   og med samme formler: 1,5 prosent per handel, 7,5 prosent samlet aapen risiko
   og 100 prosent brutto eksponering. Ingen belaaning. */
function storsteTillatte(r, inngang, stop){
  const ek = Number(r?.egenkapital || 0);
  if (!(ek > 0) || !(inngang > 0)) return {feil: "mangler egenkapital eller inngang"};
  if (r.stoppet) return {antall: 0, binder: "dagsstopp eller månedsstopp er utløst"};
  if (!(stop > 0) || stop >= inngang) return {antall: 0, binder: "stop må ligge under inngang"};
  const tap = inngang - stop;
  const brukt_risiko = (r.aapen_risiko_pct === null || r.aapen_risiko_pct === undefined) ? null : r.aapen_risiko_pct;
  const per = {
    per_handel: (1.5 / 100 * ek) / tap,
    aapen_risiko: brukt_risiko === null ? Infinity : Math.max(0, (7.5 / 100 * ek) - (brukt_risiko / 100 * ek)) / tap,
    eksponering: Math.max(0, (100 / 100 * ek) - ((r.eksponering_pct || 0) / 100 * ek)) / inngang,
  };
  const binder = Object.keys(per).reduce((a, b) => per[a] <= per[b] ? a : b);
  const antall = Math.floor(Math.min(...Object.values(per)) + 1e-6);
  return {antall, binder, per_grense: per, tap,
          risiko_pct: Math.round(1e4 * antall * tap / ek) / 100,
          verdi: Math.round(100 * antall * inngang) / 100,
          ukjent_risiko: brukt_risiko === null};
}
function maaler(navn, verdi, tak, enhet){
  if (verdi === null || verdi === undefined) return `<div class="lrow"><div class="lco"><b>${esc(navn)}</b><span class="muted">ukjent</span></div><div class="lt">–</div></div>`;
  const andel = Math.max(0, Math.min(100, 100 * verdi / tak));
  const over = verdi > tak;
  return `<div class="lrow"><div class="lco"><b>${esc(navn)}</b><span class="muted">tak ${tak}${esc(enhet || " %")}</span>
      <div class="progress" style="margin-top:6px"><i style="width:${andel.toFixed(0)}%${over ? ";background:var(--neg,#c0392b)" : ""}"></i></div></div>
    <div class="lt"><span class="tnum ${over ? "neg" : ""}">${verdi.toFixed(2)}${esc(enhet || " %")}</span></div></div>`;
}

function posBar(p){
  if (p.stop === null || p.stop === undefined || !p.price || !p.avg) return "";
  const lo = Math.min(p.stop, p.avg, p.price), hi = Math.max(p.stop, p.avg, p.price), span = (hi - lo) || 1, pad = span * .15;
  const X = v => ((v - lo + pad) / (span + 2 * pad) * 100).toFixed(1);
  return `<div class="pbar"><i class="pfill ${p.price >= p.avg ? "pos" : "neg"}" style="left:${Math.min(X(p.avg), X(p.price))}%;width:${Math.abs(X(p.price) - X(p.avg))}%"></i>
    <span class="pmark stop" style="left:${X(p.stop)}%" title="Stopp"></span><span class="pmark entry" style="left:${X(p.avg)}%" title="Inngang"></span><span class="pmark now" style="left:${X(p.price)}%" title="Kurs"></span></div>
    <div class="plab tnum"><span>Stopp ${usd(p.stop)}</span><span>Kurs ${usd(p.price)}</span></div>`;
}

async function lagreAnnotasjon(){
  const dato = ($("#a-dato")?.value || osloDate()), type = $("#a-type")?.value || "annet";

  if (tekst.length < 3) { toast("Skriv hva du endret"); return; }

    await S.db.doc("annotasjon/" + id).set({id, dato, type, tekst, created_at: new Date().toISOString()});
    const el = $("#a-tekst"); if (el) el.value = "";

async function startForsok(){
  const tittel = ($("#nf-tittel")?.value || "").trim();
  const a_navn = ($("#nf-a")?.value || "").trim() || "Som vanlig";
  const b_navn = ($("#nf-b")?.value || "").trim();
  const effekt = ($("#nf-effekt")?.value || "").trim();
  const enhet = ($("#nf-enhet")?.value || "").trim();
  const dager = Math.max(14, Math.min(28, Number($("#nf-dager")?.value) || 21));
  const start = $("#nf-start")?.value || osloDate();
  if (!tittel || !b_navn || !effekt) { toast("Tittel, betingelse B og effekt må fylles ut"); return; }
  const froe = (Date.now() ^ Math.floor(Math.random() * 2 ** 31)) >>> 0;
  const tildeling = froeRekke(froe, dager);
  const slutt = new Date(Date.parse(start) + (dager - 1) * 86400000).toISOString().slice(0, 10);
  const id = "e" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  const e = {id, tittel, a_navn, b_navn, effekt, enhet, start, slutt, dager,
    froe, tildeling, logg: [], status: "aktiv", created_at: new Date().toISOString()};
  try {
    await S.db.doc("eksperiment/" + id).set(e);
    S.fValgt = id; S.fNy = false; toast("Forsøket er startet. Tildelingen er låst."); render();
  } catch (err) { toast("Fikk ikke startet forsøket"); }
}
async function lagreForsokDag(){
  const liste = (S.forsok || []).slice().sort((a, b) => String(b.start).localeCompare(String(a.start)));
  const e = liste.find(x => x.id === S.fValgt) || liste[0];
  if (!e) return;
  const idag = osloDate();
  const idx = Math.floor((Date.parse(idag) - Date.parse(e.start)) / 86400000);
  if (idx < 0 || idx >= (e.tildeling || []).length) { toast("Dagen er utenfor perioden"); return; }
  const raa = ($("#f-verdi")?.value || "").trim();
  if (raa === "") { toast("Skriv inn dagens tall"); return; }
  const verdi = Number(raa);
  if (!isFinite(verdi)) { toast("Tallet må være et tall"); return; }
  const fulgt = $("#f-fulgt")?.value || e.tildeling[idx];
  const logg = (e.logg || []).filter(r => r.dato !== idag);
  logg.push({dato: idag, betingelse: e.tildeling[idx], fulgt, verdi});
  logg.sort((a, b) => String(a.dato).localeCompare(String(b.dato)));
  try {
    await S.db.doc("eksperiment/" + e.id).set({...e, logg, updated_at: new Date().toISOString()});
    toast("Dagen er lagret");
  } catch (err) { toast("Fikk ikke lagret dagen"); }
}

  try {
    const sample = await claude.use("sample"); if (!sample) throw {code: "not_granted"};
    const style = g.style === "forstaa" ? "Lag spørsmål som tester forståelse: hvorfor noe skjer, hvordan mekanismer henger sammen, og hva forfatteren argumenterer for." : "Lag spørsmål om sentrale fakta, begreper, definisjoner, navn, tall og årstall.";
    const out = await sample.json(`Du lager repetisjonskort (spaced repetition) på norsk bokmål fra teksten under. ${style}

Returner KUN JSON: {"cards":[{"q":"spørsmål","a":"svar"}]} med inntil ${g.n} kort.
${g.source ? "KILDE: " + g.source + "\n" : ""}TEKST:
${g.text.slice(0, 24000)}`, {modelTier: "default"});
    const cs = (out?.cards || out || []).filter(c => c && c.q && c.a).slice(0, 30).map(c => ({q: String(c.q).slice(0, 400), a: String(c.a).slice(0, 1500), keep: true}));

let PDFJS = null;
async function loadPdfJs(){ if (PDFJS) return PDFJS;
  const base = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
  await new Promise((ok, no) => { const s = document.createElement("script"); s.src = base + "pdf.min.js"; s.onload = ok; s.onerror = () => no(new Error("pdfjs")); document.head.appendChild(s); });
  const lib = window.pdfjsLib; if (!lib) throw new Error("pdfjs");
  lib.GlobalWorkerOptions.workerSrc = base + "pdf.worker.min.js";
  try { const w = new Worker(URL.createObjectURL(new Blob([`importScripts("${base}pdf.worker.min.js")`], {type: "text/javascript"}))); lib.GlobalWorkerOptions.workerPort = w; } catch {}
  PDFJS = lib; return lib; }

    for (const it of tc.items) { const y = it.transform ? Math.round(it.transform[5]) : 0; if (lastY !== null && Math.abs(y - lastY) > 2) { if (cur.trim()) lines.push(cur.trim()); cur = ""; } cur += it.str + (it.hasEOL ? "\n" : ""); lastY = y; if (it.hasEOL) { if (cur.trim()) lines.push(cur.trim()); cur = ""; lastY = null; } }
    if (cur.trim()) lines.push(cur.trim()); lines.push(""); }

}
async function shrinkImage(file, max = 1568){
  try { const bm = await createImageBitmap(file), w = bm.width, h = bm.height, s = Math.min(1, max / Math.max(w, h));
    if (s === 1 && file.size < 3.5 * 1048576 && /jpe?g|png|webp|gif/.test(file.type)) { bm.close && bm.close(); return {blob: file, w, h}; }
    const c = document.createElement("canvas"); c.width = Math.round(w * s); c.height = Math.round(h * s); c.getContext("2d").drawImage(bm, 0, 0, c.width, c.height); bm.close && bm.close();
    return {blob: await new Promise(r => c.toBlob(r, "image/jpeg", .88)), w, h}; } catch { return {blob: file, w: 0, h: 0}; } }

    const prev = out[out.length - 1];

async function runCapture(){

  const url = ($("#capurl")?.value || "").trim(), text = ($("#captext")?.value || "").trim(), note = ($("#capnote")?.value || "").trim();
  const pod = !!$("#cappod")?.checked;
  const jobs = CAP.files.map(x => ({...x, note}));
  if (url) jobs.push({kind: "url", url, text, note, pod, name: url}); else if (text) jobs.push({kind: "text", text, note, pod, name: "tekst"});
  if (!jobs.length) { CAP.status = "Velg en fil, lim inn en lenke eller skriv inn tekst først."; renderCapture(); return; }
  const sample = await claude.use("sample"), assets = await claude.use("assets");
  if (!sample && !assets) { CAP.status = "Mangler tilgang til å lagre. Sjekk nøkkelen under Status."; renderCapture(); return; }
  CAP.busy = true; CAP.stop = false; CAP.files = []; let ok = 0, fail = 0;
  for (let i = 0; i < jobs.length; i++) { const j = jobs[i]; if (CAP.stop) break;
    CAP.status = `Jobber med ${i + 1} av ${jobs.length}: ${j.name.slice(0, 60)}…`; renderCapture();
    try { const id = await capOne(j, sample, assets); CAP.done.unshift({id}); ok++; }
    catch (e) { fail++; if (e?.code === "not_granted") { CAP.status = "Claude-tilgang ble avslått."; break; } if (e?.code === "rate_limited") { CAP.status = "For mange forespørsler. Vent litt og prøv resten igjen."; break; }
      toast(e?.code === "no_assets" ? "Opplasting krever redigeringstilgang" : e?.code === "bad_url" ? "Lenken er ugyldig" : e?.code === "too_large" ? "Filen er for stor" : "Klarte ikke å lagre " + j.name.slice(0, 40)); } }
  if (url && ok) { const a = $("#capurl"), b = $("#captext"); if (a) a.value = ""; if (b) b.value = ""; } else if (text && ok) { const b = $("#captext"); if (b) b.value = ""; }
  CAP.busy = false; if (!/avslått|For mange/.test(CAP.status)) CAP.status = `${ok} lagt til${fail ? `, ${fail} feilet` : ""}${!sample && ok ? ". Ligger i Innboks til morgenkjøringen oppsummerer og sorterer." : "."}`;

function htmlToLines(html){
  const doc = new DOMParser().parseFromString(html, "text/html"), lines = [];
  doc.querySelectorAll("script,style,head,title").forEach(e => e.remove());
  const txt = el => (el.textContent || "").replace(/ /g, " ").replace(/[ \t]+/g, " ").trim();
  const walk = el => {
    for (const c of el.children) {
      const tag = c.tagName.toLowerCase();
      if (/^h[1-3]$/.test(tag)) { const t = txt(c); if (t) lines.push("#".repeat(Number(tag[1])) + " " + t); }
      else if (/^h[4-6]$/.test(tag)) { const t = txt(c); if (t) lines.push("### " + t); }
      else if (tag === "li") { const box = c.querySelector("input[type=checkbox]"); const t = txt(c); if (t) lines.push((box ? (box.checked ? "[x] " : "[] ") : (c.parentElement?.tagName === "OL" ? "1. " : "- ")) + t); }
      else if (tag === "ul" || tag === "ol") walk(c);
      else if (tag === "table") { c.querySelectorAll("tr").forEach(tr => { const cells = [...tr.children].map(txt).filter(Boolean); if (cells.length) lines.push(cells.join(" | ")); }); }
      else if (tag === "blockquote") { const t = txt(c); if (t) lines.push("> " + t); }
      else if (tag === "pre") { const t = c.textContent.trim(); if (t) lines.push("``` " + t); }
      else if (tag === "hr") lines.push("---");
      else if (["p","div","section","article","span","td","font"].includes(tag) && !c.querySelector("p,div,li,h1,h2,h3,table,ul,ol")) { const t = txt(c); if (t) lines.push(t); }
      else if (tag === "br") continue;
      else walk(c);
    }
  };
  walk(doc.body || doc.documentElement);
  return lines;
}
function mhtToHtml(raw){
  const m = raw.match(/boundary="?([^"\r\n;]+)"?/i); const parts = m ? raw.split("--" + m[1]) : [raw];
  const p = parts.find(x => /content-type:\s*text\/html/i.test(x)) || raw;
  let body = p.replace(/^[\s\S]*?\r?\n\r?\n/, "");
  if (/quoted-printable/i.test(p)) body = body.replace(/=\r?\n/g, "").replace(/=([0-9A-F]{2})/gi, (_, h) => String.fromCharCode(parseInt(h, 16)));
  try { body = decodeURIComponent(escape(body)); } catch {}
  return body;
}

${text.slice(0, 12000)}`, {modelTier: "quick"});

function gradeCard(g){
  const ses = S.session; if (!ses?.q.length || !ses.flipped) return;
  const d = LD(ses.deck), cid = ses.q.shift(), s = d.s || (d.s = {}), wasNew = !s[cid];
  const forrige = s[cid];
  s[cid] = nextState(s[cid], g);

  // kan bygge paa. Den er kompakt: dagnummer, stokk, kort, karakter og dager
  // siden forrige repetisjon.
  rlogg({d: dayNum(), s: ses.deck, c: cid, g, e: forrige && forrige[7] !== null && forrige[7] !== undefined ? dayNum() - forrige[7] : null});
  const day = osloDate(), stats = d.stats || (d.stats = {}); const st = stats[day] || (stats[day] = {n:0, ok:0, new:0});
  st.n++; if (g > 1) st.ok++; if (wasNew) st.new++;
  if (g === 1) { ses.again++; ses.q.splice(Math.min(ses.q.length, 4), 0, cid); } else ses.done++;
  ses.flipped = false; markDirty(DECKS[ses.deck].path); render();
}
