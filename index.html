<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://api.github.com; worker-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f3f2f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0b0d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Morgenpuls">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Morgenpuls</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: én smal kolonne (mobil først), klebrig fanelinje øverst, kort med rød markeringslinje for det som er nytt. */
:root{
  --bg:#f3f2f0; --surface:#ffffff; --surface-2:#ebe9e6; --line:#dcd9d4;
  --fg:#17161a; --muted:#6c6870; --accent:#d7262e; --accent-soft:#fbe3e3;
  --ok:#1f8a4c; --warn:#b26a00; --ok-soft:#dff2e6; --warn-soft:#fbeed8;
  --tp-geo:#2a6fd6; --tp-hel:#d2357f; --tp-his:#d9a400; --tp-vit:#2f9a4f; --tp-fin:#8a5a2b; --tp-spo:#e8701f;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c0b0d; --surface:#18171b; --surface-2:#232127; --line:#2e2c33;
  --fg:#f2f0f3; --muted:#9a96a0; --accent:#ef3b42; --accent-soft:#3a1517;
  --ok:#4cc27c; --warn:#e5a33a; --ok-soft:#14301f; --warn-soft:#33240e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c0b0d; --surface:#18171b; --surface-2:#232127; --line:#2e2c33;
  --fg:#f2f0f3; --muted:#9a96a0; --accent:#ef3b42; --accent-soft:#3a1517;
  --ok:#4cc27c; --warn:#e5a33a; --ok-soft:#14301f; --warn-soft:#33240e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 0}
.brand{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}
.mark{width:32px;height:32px;border-radius:9px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;position:relative}
.mark::after{content:"";position:absolute;right:9px;bottom:8px;width:4px;height:4px;background:var(--accent);border-radius:1px}
.wordmark{font-family:var(--f-mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;font-weight:500}
.wordmark span{color:var(--muted)}
.dayctl{display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;padding:4px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.plain::before{display:none}
select.day{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-family:var(--f-mono);font-size:12px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-top:12px;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:10px 12px 11px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab .n{font-family:var(--f-mono);font-size:11px;margin-left:5px;color:var(--muted)}

/* generic */
section.view{display:grid;gap:16px;padding-top:18px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(26px,6vw,38px);font-weight:800;line-height:1.05}
h2{font-size:20px;font-weight:800}
h3{font-size:17px;font-weight:700;line-height:1.3}
p{margin:0}
.muted{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stack{display:grid;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;color:var(--muted);text-align:left}
.empty b{color:var(--fg)}
.badge{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border-radius:5px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.rct{border-color:var(--accent);color:var(--accent)}
.link{font-weight:600;text-decoration:none;display:inline-flex;gap:4px;align-items:center}
.link::after{content:"↗";color:var(--accent);font-size:13px}
.link:hover{text-decoration:underline}
.tnum{font-variant-numeric:tabular-nums}
input.txt,textarea.txt,select.txt{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
textarea.txt{min-height:110px;resize:vertical;line-height:1.45}
label.lbl{display:grid;gap:5px;font-size:13px;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}

/* oversikt */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:560px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;cursor:pointer;display:grid;gap:2px}
.tile:hover{border-color:var(--muted)}
.tile .big{font-family:var(--f-display);font-size:30px;font-weight:800;line-height:1}
.tile .lab{font-size:13px;color:var(--muted)}
.hero-date{display:grid;gap:6px}

/* helse */
.hhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pmlogo{font-family:var(--f-display);font-weight:800;font-size:18px;background:var(--fg);color:var(--bg);padding:6px 12px;border-radius:9px}
.count{text-align:right}
.count .big{font-family:var(--f-display);font-size:42px;font-weight:800;line-height:.95}
.segbar{display:flex;gap:4px;height:8px;margin-top:16px}
.segbar i{display:block;border-radius:4px;min-width:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{color:var(--fg);font-variant-numeric:tabular-nums}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:600;font-size:14px}
.chip .x{border:0;background:none;color:var(--muted);cursor:pointer;padding:0 0 0 2px;font-size:15px;line-height:1}
.chip.on::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
button.chip{cursor:pointer}
button.chip:hover{border-color:var(--muted)}
.chip .cnt{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:500}
.chip.sel{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip.sel .cnt{color:var(--bg);opacity:.75}
.chip.sel::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.legend .lg{background:none;border:0;padding:3px 6px;margin:-3px -6px;border-radius:6px;display:inline-flex;align-items:center;gap:6px;color:var(--muted);cursor:pointer;font-size:13px}
.legend .lg:hover{background:var(--surface-2)}
.legend .lg.sel{background:var(--surface-2);color:var(--fg)}
.legend .lg.dim{opacity:.45}
.card .q.hq{font-size:clamp(19px,4.6vw,25px);max-width:30ch}
.fbwrap{width:100%;overflow-x:auto}
svg.fb{width:100%;height:auto;display:block}
.notes-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.notes-grid.nat{grid-template-columns:repeat(7,minmax(0,1fr))}
.notes-grid .opt{text-align:center;padding:10px 0}
@media (max-width:460px){.notes-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.notes-grid.nat{grid-template-columns:repeat(4,minmax(0,1fr))}}
.strbars{display:grid;gap:8px}
.strbar{display:grid;grid-template-columns:24px minmax(0,1fr) 48px;gap:10px;align-items:center;font-family:var(--f-mono);font-size:12px}
.chordgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.chord{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 8px 10px;display:grid;justify-items:center;gap:4px}
.chord.known{border-color:var(--ok)}
.chordbtn{background:none;border:0;cursor:pointer;display:grid;justify-items:center;gap:2px;padding:4px;border-radius:8px;width:100%}
.chordbtn:hover{background:var(--surface-2)}
.chordbtn b{font-family:var(--f-display);font-size:17px}
svg.chordsvg{width:100px;height:auto}
.check.small{font-size:12px;color:var(--muted)}
.metnum{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1}
input[type=range]{width:100%;accent-color:var(--accent)}
/* trading */

.iconbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;cursor:pointer;font-size:12px;font-weight:600;color:var(--fg)}
.iconbtn:hover{border-color:var(--muted)}
.impcat{display:grid;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.impsub{display:grid;gap:6px;padding-left:10px}
.impsub b{font-size:14px}
.improw{display:grid;grid-template-columns:auto minmax(0,2fr) minmax(0,1fr) minmax(0,1fr);gap:6px;align-items:center}
.improw.off{opacity:.45}
.improw .txt{padding:6px 8px;font-size:13px}
@media (max-width:560px){.improw{grid-template-columns:auto minmax(0,1fr)}.improw select,.improw [data-impsub]{grid-column:2}}

.savebtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.savebtn:hover{border-color:var(--muted)}
.savebtn.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.badge.big{border-color:var(--ok);color:var(--ok)}
.nb.link,.nb.score{align-items:center}
.bookmark{flex:1;display:grid;gap:2px;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.bookmark:hover{border-color:var(--muted)}
.bookmark span{font-size:12px}
.bookmark b,.bookmark span{overflow-wrap:anywhere}
.sc{flex:1;display:grid;gap:8px;padding:6px 0}
.sc .muted{font-size:13px}
.scale{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;max-width:440px}
.scale button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 0;cursor:pointer;font-weight:700;font-variant-numeric:tabular-nums}
.scale button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.jcard{border-left:3px solid var(--accent)}
.jlist{margin:0;padding-left:18px;display:grid;gap:3px}
.jdeep{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--surface-2, rgba(127,127,127,.08))}
.jhist{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap}
.jhist div{display:flex;gap:3px;align-items:flex-end;height:36px}
.jhist div span{font-family:var(--f-mono);font-size:11px;margin-right:3px}
.jhist i{display:block;width:8px;background:var(--accent);border-radius:2px 2px 0 0;opacity:.85}
.pos{color:var(--ok)} .neg{color:var(--accent)}
.tile.static{cursor:default}.tile.static:hover{border-color:var(--line)}
.tile .big small{font-size:16px;font-weight:700}
.notice{border:1px solid var(--warn);background:var(--warn-soft);color:var(--fg);border-radius:12px;padding:10px 14px;font-size:14px}
.posrow{display:grid;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.posrow:last-of-type{border-bottom:0}
.pos-h{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.sym{font-family:var(--f-display);font-size:18px}
.pbar{position:relative;height:10px;background:var(--surface-2);border-radius:5px;margin:4px 6px}
.pfill{position:absolute;top:0;bottom:0;border-radius:5px}.pfill.pos{background:var(--ok-soft);border:1px solid var(--ok)}.pfill.neg{background:var(--accent-soft);border:1px solid var(--accent)}
.pmark{position:absolute;top:-4px;width:3px;height:18px;border-radius:2px;transform:translateX(-50%)}
.pmark.stop{background:var(--accent)}.pmark.entry{background:var(--muted)}.pmark.now{background:var(--fg);width:4px}
.plab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.sparkwrap{width:100%}svg.spark{width:100%;height:auto;display:block}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:0 18px}
.kv div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv span{color:var(--muted)}
.tblwrap{overflow-x:auto;width:100%}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:480px}
.tbl th{text-align:left;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td .muted{font-size:12px}
.trades{display:grid}
.trow2{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.trow2 .muted{font-size:12.5px}
.tright{text-align:right}
.trline{display:grid;gap:4px;text-align:left;cursor:pointer;width:100%}
.trline:hover{border-color:var(--muted)}
/* egne kort */
.genrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)}
.genrow.off{opacity:.45}
.srcgrp{border-bottom:1px solid var(--line)}
.srchead{width:100%;display:flex;justify-content:space-between;gap:10px;background:none;border:0;padding:10px 0;cursor:pointer;text-align:left}
.owncard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:8px 0;font-size:14px}
.owncard .x,.nb .x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:0 4px}
.card .ans .a.own{font-size:20px;line-height:1.35;max-width:40ch;font-family:var(--f-body);font-weight:600}
/* notater */
.notes-app{display:grid;grid-template-columns:240px minmax(0,1fr);gap:22px;align-items:start}
.nside{display:grid;gap:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 110px);max-height:calc(100vh - 140px);overflow:auto;padding-bottom:10px}
.tree{display:grid;gap:1px}
.trow{display:flex;align-items:center;gap:2px;border-radius:8px}
.trow.sel{background:var(--surface-2)}
.tw{width:20px;flex:0 0 20px;border:0;background:none;color:var(--muted);cursor:pointer;font-size:11px;padding:0}
.tl{flex:1;min-width:0;text-align:left;border:0;background:none;padding:6px 6px;cursor:pointer;border-radius:6px;font-size:14px;overflow:hidden;text-overflow:ellipsis}
.tl:hover{background:var(--surface-2)}
.nmain{min-width:0}
.ned{position:relative;display:grid;gap:10px;max-width:720px}
.nbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0}
.crumb{border:0;background:none;color:var(--muted);cursor:pointer;padding:2px 4px;border-radius:5px;font-size:13px}
.crumb:hover{background:var(--surface-2);color:var(--fg)}
.nsave{margin-left:auto;font-family:var(--f-mono);font-size:11px}
.ntitle{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,6vw,40px);line-height:1.1;outline:none;letter-spacing:-.01em;word-break:break-word}
[contenteditable]:empty::before{content:attr(data-ph);color:var(--muted);opacity:.6;pointer-events:none}
.nmeta{font-size:12px;font-family:var(--f-mono)}
.nblocks{display:grid;gap:2px}
.nb{display:flex;gap:8px;align-items:flex-start;padding:3px 4px;border-radius:6px;min-height:28px}
.nb:focus-within{background:color-mix(in srgb,var(--surface-2) 55%,transparent)}
.nt{flex:1;min-width:0;outline:none;white-space:pre-wrap;word-break:break-word;line-height:1.6;font-size:16px}
.nb .nt:empty::before{opacity:0}
.nb:focus-within .nt:empty::before,.nb[data-j] .nt:empty::before{opacity:.6}
.nb[data-j]{border-bottom:1px dashed var(--line);border-radius:0}
.nb.h1 .nt{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.25;padding-top:10px}
.nb.h2 .nt{font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.3;padding-top:8px}
.nb.h3 .nt{font-weight:700;font-size:17px;padding-top:4px}
.nb.quote{border-left:3px solid var(--fg);padding-left:12px;border-radius:0}
.nb.quote .nt{font-style:italic}
.nb.callout{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.nb.callout::before{content:"!";font-family:var(--f-display);font-weight:800;color:var(--accent)}
.nb.code{background:var(--surface-2);border-radius:8px;padding:10px 12px}
.nb.code .nt{font-family:var(--f-mono);font-size:13.5px}
.nb.done .nt{text-decoration:line-through;color:var(--muted)}
.ncheck{margin-top:6px;width:16px;height:16px;accent-color:var(--accent);flex:0 0 auto}
.nbul{flex:0 0 18px;text-align:right;line-height:1.6;font-size:16px;color:var(--muted)}
.nb.hr{padding:8px 4px}.nb.hr hr{flex:1;border:0;border-top:1px solid var(--line);margin:0}
.nb.page{align-items:center}
.nb.img{align-items:flex-start}
.ned,.nblocks{grid-template-columns:minmax(0,1fr)}
.nimg{flex:1;margin:4px 0;min-width:0}

<script>
/* Morgenpuls som egen app: leser data fra det private GitHub-repoet med en personlig nøkkel (kun lesing).
   Nøkkelen lagres bare på denne enheten (IndexedDB). Ingen data ligger i dette offentlige repoet. */
(() => {
  const OWNER = "regg92s-hub", REPO = "morgenpuls", API = "https://api.github.com";
  const KV = (() => { let dbp; const open = () => dbp || (dbp = new Promise((res, rej) => { const r = indexedDB.open("mp-app", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }));
    const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction("kv", mode); const q = fn(t.objectStore("kv")); t.oncomplete = () => res(q?.result); t.onerror = () => rej(t.error); }); };
    return { get: k => tx("readonly", s => s.get(k)), set: (k, v) => tx("readwrite", s => s.put(v, k)), del: k => tx("readwrite", s => s.delete(k)) }; })();
  const gh = (path, token, extra = {}) => fetch(API + path, { headers: { Authorization: "Bearer " + token, Accept: "application/vnd.github.raw+json", "X-GitHub-Api-Version": "2022-11-28", ...extra }, cache: "no-store" });

  // ---------- skrivebeskyttet database med samme grensesnitt som i Claude ----------
  let DATA = null; const listeners = new Set();
  const ro = () => Promise.reject({ code: "read_only" });
  const clone = v => v == null ? v : JSON.parse(JSON.stringify(v));
  const docSnap = (id, v) => ({ id, exists: v !== undefined, data: () => clone(v) });
  function split(path) { const p = path.split("/"); return [p.slice(0, -1).join("/"), p[p.length - 1]]; }
  function runQuery(q) {
    const col = DATA?.collections?.[q.coll] || {};
    let docs = Object.entries(col).map(([id, v]) => ({ id, v }));
    if (q.order) { const [f, dir] = q.order; docs.sort((a, b) => { const x = a.v?.[f], y = b.v?.[f]; const c = x == null ? -1 : y == null ? 1 : x < y ? -1 : x > y ? 1 : 0; return dir === "desc" ? -c : c; }); }
    if (q.lim) docs = docs.slice(0, q.lim);
    const ds = docs.map(d => docSnap(d.id, d.v)); return { docs: ds, empty: !ds.length, size: ds.length, forEach: f => ds.forEach(f) };
  }
  function query(q) {
    return { orderBy: (f, dir = "asc") => query({ ...q, order: [f, dir] }), limit: n => query({ ...q, lim: n }), where: () => query(q),
      get: async () => runQuery(q),
      onSnapshot(cb, err) { const l = () => { try { cb(runQuery(q)); } catch (e) { err && err(e); } }; listeners.add(l); if (DATA) queueMicrotask(l); return () => listeners.delete(l); },
      doc: id => docRef(q.coll + "/" + id), add: ro };
  }
  function docRef(path) {
    const [c, id] = split(path); const val = () => DATA?.collections?.[c]?.[id];
    return { id, get: async () => docSnap(id, val()), set: ro, update: ro, delete: ro,
      onSnapshot(cb, err) { const l = () => { try { cb(docSnap(id, val())); } catch (e) { err && err(e); } }; listeners.add(l); if (DATA) queueMicrotask(l); return () => listeners.delete(l); } };
  }
  const db = { collection: name => query({ coll: name }), doc: docRef, batch: () => ({ set() {}, update() {}, delete() {}, commit: ro }) };
  let ready; const dbReady = new Promise(r => ready = r);
  window.claude = { use: async name => name === "db" ? (await dbReady, db) : null };

  // ---------- statuslinje og innstillinger ----------
  const css = `.mpbar{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;gap:6px;align-items:center;font:12px/1.2 var(--f-mono,monospace);background:var(--surface,#fff);color:var(--muted,#666);border:1px solid var(--line,#ddd);border-radius:999px;padding:6px 10px;box-shadow:0 2px 10px rgba(0,0,0,.08);cursor:pointer}
.mpbar i{width:7px;height:7px;border-radius:50%;background:var(--ok,#1f8a4c)}.mpbar.old i{background:var(--warn,#b26a00)}.mpbar.err i{background:var(--accent,#d7262e)}
.mpgate{position:fixed;inset:0;z-index:60;background:var(--bg,#f3f2f0);color:var(--fg,#111);overflow:auto;padding:max(24px,env(safe-area-inset-top)) 16px 32px}
.mpgate .in{max-width:520px;margin:0 auto;display:grid;gap:14px}.mpgate h1{font:800 26px/1.15 var(--f-display,sans-serif);margin:8px 0 0}
.mpgate ol{margin:0;padding-left:20px;display:grid;gap:6px}.mpgate input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line,#ccc);background:var(--surface,#fff);font:14px var(--f-mono,monospace)}
.mpgate .row{display:flex;gap:8px;flex-wrap:wrap}.mpgate .e{color:var(--accent,#d7262e);font-weight:600;min-height:1.2em}.mpgate code{font-size:13px}`;
  const st = document.createElement("style"); st.textContent = css; document.head.appendChild(st);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmt = iso => { if (!iso) return "–"; const d = new Date(iso); return d.toLocaleString("nb-NO", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }); };
  let bar; function setBar(cls, txt) { if (!bar) { bar = document.createElement("button"); bar.className = "mpbar"; bar.type = "button"; bar.onclick = settings; document.body.appendChild(bar); } bar.className = "mpbar " + (cls || ""); bar.innerHTML = `<i></i><span>${esc(txt)}</span>`; }

  function gate(msg) {
    return new Promise(resolve => {
      const g = document.createElement("div"); g.className = "mpgate"; g.setAttribute("role", "dialog"); g.setAttribute("aria-label", "Koble til data");
      g.innerHTML = `<div class="in"><h1>Morgenpuls</h1>
        <p>Appen viser dataene dine fra det private repoet <b>${OWNER}/${REPO}</b>. Lim inn den personlige nøkkelen din fra GitHub én gang på denne enheten.</p>
        <p class="e" id="mpe">${esc(msg || "")}</p>
        <label for="mptok"><b>Nøkkel</b> (starter med <code>github_pat_</code>)</label>
        <input id="mptok" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="github_pat_…">
        <div class="row"><button class="btn primary" id="mpgo" type="button">Koble til</button></div>
        <p class="muted" style="font-size:13px">Nøkkelen lagres bare på denne enheten og sendes bare til api.github.com. Den skal ha <b>kun lesetilgang</b> til <b>kun</b> repoet ${REPO}.</p></div>`;
      document.body.appendChild(g);
      const go = async () => { const t = g.querySelector("#mptok").value.trim(); const e = g.querySelector("#mpe");
        if (!/^(github_pat_|ghp_)[A-Za-z0-9_]{20,}$/.test(t)) { e.textContent = "Det ser ikke ut som en GitHub-nøkkel."; return; }
        e.textContent = "Sjekker…";
        try { const r = await fetch(API + `/repos/${OWNER}/${REPO}`, { headers: { Authorization: "Bearer " + t, Accept: "application/vnd.github+json" }, cache: "no-store" });
          if (r.status === 401) { e.textContent = "GitHub godtok ikke nøkkelen."; return; }
          if (r.status === 404 || r.status === 403) { e.textContent = "Nøkkelen har ikke tilgang til repoet " + REPO + "."; return; }
          if (!r.ok) { e.textContent = "GitHub svarte " + r.status + ". Prøv igjen."; return; }
          await KV.set("token", t); g.remove(); resolve(t);
        } catch { e.textContent = "Fikk ikke kontakt med GitHub. Sjekk nettet."; } };
      g.querySelector("#mpgo").onclick = go; g.querySelector("#mptok").addEventListener("keydown", ev => { if (ev.key === "Enter") go(); });
      setTimeout(() => g.querySelector("#mptok").focus(), 50);
    });
  }
  function settings() {
    const g = document.createElement("div"); g.className = "mpgate";
    g.innerHTML = `<div class="in"><h1>Data</h1><p>Sist oppdatert i repoet: <b>${fmt(DATA?.generated_at)}</b>. Morgenkjøringen lager en ny kopi hver morgen.</p>
      <p class="muted" style="font-size:13px">Appen er skrivebeskyttet. Endringer gjør du i Morgenpuls i Claude, så kommer de hit etter neste morgenkjøring.</p>
      <div class="row"><button class="btn primary" id="mpref" type="button">Hent på nytt</button><button class="btn" id="mpx" type="button">Lukk</button></div>
      <hr style="border:0;border-top:1px solid var(--line,#ddd);width:100%"><p><b>Fjern nøkkelen fra denne enheten</b><br><span class="muted" style="font-size:13px">Sletter nøkkelen og alle lagrede data på denne enheten. Repoet påvirkes ikke.</span></p>
      <div class="row"><button class="btn" id="mpdel" type="button" style="color:var(--accent,#d7262e)">Fjern nøkkel og data</button></div></div>`;
    document.body.appendChild(g);
    g.querySelector("#mpx").onclick = () => g.remove();
    g.querySelector("#mpref").onclick = async () => { g.remove(); await refresh(true); };
    g.querySelector("#mpdel").onclick = async () => { await KV.del("token"); await KV.del("data"); await KV.del("etag"); try { await caches.delete("mp-assets"); } catch {} location.reload(); };
  }

  // ---------- henting ----------
  let token = null;
  async function refresh(manual) {
    setBar("", "Henter data…");
    try {
      const etag = await KV.get("etag"); const h = etag && DATA ? { "If-None-Match": etag } : {};
      const r = await gh(`/repos/${OWNER}/${REPO}/contents/bundle/data.json?ref=main`, token, h);
      if (r.status === 304) { setBar(age(), "Data " + fmt(DATA.generated_at)); return; }
      if (r.status === 401 || r.status === 403 || r.status === 404) { await KV.del("token"); token = await gate(r.status === 401 ? "Nøkkelen er utløpt eller trukket tilbake. Lag en ny." : "Nøkkelen har ikke lenger tilgang til repoet."); return refresh(manual); }
      if (!r.ok) throw new Error("HTTP " + r.status);
      const d = await r.json(); DATA = d; await KV.set("data", d); await KV.set("etag", r.headers.get("ETag") || "");
      postAssets(); listeners.forEach(l => l()); ready(); setBar(age(), "Data " + fmt(d.generated_at));
    } catch (e) { setBar("err", DATA ? "Uten nett · data " + fmt(DATA.generated_at) : "Fikk ikke hentet data"); }
  }
  const age = () => DATA && Date.now() - new Date(DATA.generated_at) > 36 * 3600e3 ? "old" : "";
  function postAssets() { navigator.serviceWorker?.controller?.postMessage({ type: "cfg", token, assets: DATA?.assets || {} }); }

  async function start() {
    if ("serviceWorker" in navigator) {
      try { await navigator.serviceWorker.register("sw.js"); } catch {}
      navigator.serviceWorker.addEventListener("message", e => { if (e.data?.type === "need-cfg") postAssets(); });
      navigator.serviceWorker.addEventListener("controllerchange", postAssets);
    }
    token = await KV.get("token").catch(() => null);
    if (!token) token = await gate();
    const cached = await KV.get("data").catch(() => null);
    if (cached) { DATA = cached; ready(); listeners.forEach(l => l()); setBar(age(), "Data " + fmt(cached.generated_at)); postAssets(); }
    await refresh(false);
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refresh(false); });
  }
  // skrivebeskyttet: ingen redigerbare felt
  const lockEdit = () => document.querySelectorAll('[contenteditable]:not([contenteditable="false"])').forEach(e => e.setAttribute("contenteditable", "false"));
  new MutationObserver(lockEdit).observe(document.documentElement, { subtree: true, childList: true, attributes: true, attributeFilter: ["contenteditable"] });
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
})();

</script>
<script>
(() => {
"use strict";

// Snapshot-data fra db er frosset; kopier før siden endrer noe i den (ellers stopper lagring av notater, kort og gitar).

const S = {

  hType: null, hTheme: null, trading: null, notes: [], ownCards: null, gen: {text:"", source:"", n:10, style:"fakta", preview:[], busy:false, status:""}, ownOpen: null,

const TYPES = {RCT:{l:"RCT",c:"var(--accent)"}, Oversikt:{l:"Oversikter",c:"var(--fg)"}, Observasjon:{l:"Observasjon",c:"var(--muted)"}, Kasus:{l:"Kasus",c:"var(--line)"}, Annet:{l:"Annet",c:"var(--surface-2)"}};

const feed = () => S.feeds[S.feedIdx] || null;

/* ---------- navigasjon ---------- */

function go(v){ if (!VIEWS.includes(v)) v = "idag"; S.view = v; try { history.replaceState(null, "", "#" + v); } catch {} store.set("mp.view", v);

  ${h?.note ? `<p class="muted" style="font-size:13px">${esc(h.note)}</p>` : ""}`;
}

/* finans + nyheter */
function newsCard(n){

function vFinance(){

const MA_TF = [["d", "Dag", "handelsdager", "handelsdag"], ["m", "Måned", "måneder", "måned"], ["q", "Kvartal", "kvartaler", "kvartal"]];
const maCls = s => s === "gronn" || s === "gronn-flat" ? "g" : s === "rod" || s === "rod-flat" ? "r" : s === "gul" ? "y" : "n";
const maTxt = {gronn: "Over, stiger", "gronn-flat": "Over, flatt snitt", gul: "Blandet", "rod-flat": "Under, flatt snitt", rod: "Under, faller", kort: "For kort historikk"};
const trendArrow = t => t === "stiger" ? "↗" : t === "faller" ? "↘" : t === "flat" ? "→" : "";
const maNf = (x, d = 1) => x == null || !isFinite(x) ? "–" : Number(x).toLocaleString("nb-NO", {maximumFractionDigits: d, minimumFractionDigits: 0});
const maPx = x => x == null ? "–" : Number(x).toLocaleString("nb-NO", {maximumSignificantDigits: 4});
const maSgn = x => x == null ? "–" : (x > 0 ? "+" : x < 0 ? "−" : "") + maNf(Math.abs(x)) + " %";
function maChip(t){
  if (!t) return `<span class="mac n">–</span>`;
  if (t.status === "kort") return `<span class="mac n" title="${esc(t.bars + " av 36")}">${esc(t.bars)}/36</span>`;
  return `<span class="mac ${maCls(t.status)}" title="${esc(maTxt[t.status] || "")}"><b>${t.above ? "Over" : "Under"}</b><span class="tnum">${maSgn(t.dist)}</span><i aria-hidden="true">${trendArrow(t.trend)}</i></span>`;
}
const maRsiCls = v => v == null ? "" : v >= 75 ? "r" : v >= 65 ? "y" : "";
function maRsi(t, long){
  if (!t || t.rsi == null) return "";
  const c = maRsiCls(t.rsi), tip = c === "r" ? "RSI 75 eller høyere" : c === "y" ? "RSI mellom 65 og 75" : "RSI under 65";
  return `<span class="marsi ${c}" title="${tip}">${long ? "RSI 14: " : "RSI "}<b class="tnum">${maNf(t.rsi, 1)}</b></span>`;
}
const MA_SORTS = {d: "Dag", m: "Måned", q: "Kvartal"};
function maSortVal(r, k){ const t = r[k]; return r.error || !t || t.status === "kort" || t.dist == null ? null : t.dist; }
function maSort(items){
  const {k, dir} = S.maSort || (S.maSort = {k: "q", dir: -1});
  return items.slice().sort((a, b) => { const x = maSortVal(a, k), y = maSortVal(b, k);
    if (x == null && y == null) return String(a.name).localeCompare(String(b.name), "nb");
    if (x == null) return 1; if (y == null) return -1;
    return dir * (x - y) || String(a.name).localeCompare(String(b.name), "nb"); });
}
function maSpark(t, kind){
  const c = t?.closes || [], m = t?.mas || [];
  const vals = [...c, ...m].filter(v => v != null && isFinite(v));
  if (vals.length < 2) return "";
  const W = 300, H = 74, P = 4, lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || hi || 1, n = c.length;
  const X = i => P + i * (W - 2 * P) / Math.max(1, n - 1), Y = v => H - P - (v - lo) / span * (H - 2 * P);
  const line = arr => { let d = "", on = false; arr.forEach((v, i) => { if (v == null) { on = false; return; } d += (on ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1); on = true; }); return d; };
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="maspark" role="img" aria-label="Kurs og 36-snitt, ${esc(kind)}"><path d="${line(m)}" class="ma"/><path d="${line(c)}" class="px"/></svg>`;
}
function maPeriodLabel(p, kind){ if (!p) return ""; if (kind === "m") { const [y, mo] = p.split("-"); return ["jan","feb","mar","apr","mai","jun","jul","aug","sep","okt","nov","des"][+mo - 1] + " " + y; } if (kind === "q") return p.replace("-K", " K"); return p.split("-").reverse().join("."); }

const REGIONS = ["Europe","Asia","Africa","North_America","South_America","Oceania"];
const RL = {Europe:"Europa",Asia:"Asia",Africa:"Afrika",North_America:"Nord-Amerika",South_America:"Sør-Amerika",Oceania:"Oseania"};
const HCATS = ["Norge","Verden","Økonomi","Vitenskap"];

function defaultSettings(deck){ return deck === "own" || deck === "vg3" ? {newPerDay: 10} : deck === "hist" ? {newPerDay: 5, cats: []} : {newPerDay: 15, types: {flag:true, map:true, cap:true, capq:true}, regions: []}; }
const LD = deck => S.L[deck];
function vLearn(){
  const sub = S.learnSub;
  const tabs = `<div class="subtabs">${[["geo","Geografi"],["hist","Historie"],["vg3","Historie Vg3"],["own","Egne kort"],["tp","Dagens huskestue"]].map(([k,l]) => { const n = k === "tp" ? 0 : dueCount(k); return `<button class="btn small ${sub===k?"primary":""}" data-sub="${k}">${l}${n ? ` · ${n}` : ""}</button>`; }).join("")}</div>`;
  if (sub === "tp") return tabs + learnTp();
  if (sub === "geo" && !S.geo) return tabs + `<div class="empty"><b>Laster Ultimate Geography…</b></div>`;
  if (sub === "hist" && !S.hist) return tabs + `<div class="empty"><b>Laster historiekortene…</b></div>`;
  if ((sub === "own" || sub === "vg3") && !S.db) return tabs + `<div class="empty"><b>Lagring er ikke tilgjengelig i denne visningen.</b></div>`;
  return tabs + learnDeck(sub);
}
function cardsAll(deck){
  const set = LD(deck)?.settings || defaultSettings(deck), out = [];
  if (deck === "hist") { for (const c of S.hist || []) if (!set.cats?.length || set.cats.includes(c.cat)) out.push("h:" + c.id); return out; }
  if (deck === "vg3") { for (const c of (S.vg3Cards || []).slice().sort((a,b) => (a.n || 0) - (b.n || 0))) out.push("v:" + c.id); return out; }
  if (deck === "own") { for (const c of (S.ownCards || []).slice().sort((a,b) => String(a.created_at || "").localeCompare(String(b.created_at || "")))) out.push("o:" + c.id); return out; }
  for (const c of S.geo || []) {
    if (set.regions?.length && !c.tags.some(t => set.regions.includes(t))) continue;
    if (set.types.flag && c.hasFlag) out.push("flag:" + c.id);
    if (set.types.map && c.hasMap) out.push("map:" + c.id);
    if (set.types.cap && c.cap) out.push("cap:" + c.id);
    if (set.types.capq && c.cap) out.push("capq:" + c.id);
  }
  return out;
}
// Søskensperre som i Anki: maks ett geografikort per land i dagens kø, så kortene ikke avslører hverandre.
function queues(deck){
  const today = dayNum(), d = LD(deck), s = d.s || {}, set = d.settings || defaultSettings(deck);
  const all = cardsAll(deck), used = new Set(), key = id => deck === "geo" ? id.split(":")[1] : id;
  const due = all.filter(id => s[id] && s[id][0] <= today).sort((a,b) => s[a][0] - s[b][0]).filter(id => !used.has(key(id)) && used.add(key(id)));
  let left = Math.max(0, set.newPerDay - (d.stats?.[osloDate()]?.new || 0)); const fresh = [];
  for (const id of all) { if (!left) break; if (s[id] || used.has(key(id))) continue; used.add(key(id)); fresh.push(id); left--; }

/* gripebrett-SVG */
function fretboardSvg(mark){

  const fx = f => f === 0 ? x0 - 26 : x0 + (f - 0.5) * fw;

  svg += `<rect x="${x0}" y="${top - 6}" width="${12 * fw}" height="${gap * 5 + 12}" rx="4" fill="var(--surface-2)"/>`;
  [3,5,7,9].forEach(f => svg += `<circle cx="${x0 + (f - .5) * fw}" cy="${top + gap * 2.5}" r="5" fill="var(--line)"/>`);
  svg += `<circle cx="${x0 + 11.5 * fw}" cy="${top + gap * 1.5}" r="5" fill="var(--line)"/><circle cx="${x0 + 11.5 * fw}" cy="${top + gap * 3.5}" r="5" fill="var(--line)"/>`;
  for (let f = 0; f <= 12; f++) svg += `<line x1="${x0 + f * fw}" y1="${top - 6}" x2="${x0 + f * fw}" y2="${top + gap * 5 + 6}" stroke="${f === 0 ? "var(--fg)" : "var(--muted)"}" stroke-width="${f === 0 ? 5 : 1.5}"/>`;
  for (let s = 0; s < 6; s++) { const y = top + gap * (5 - s); svg += `<line x1="${x0 - 44}" y1="${y}" x2="${x0 + 12 * fw}" y2="${y}" stroke="var(--muted)" stroke-width="${1 + (5 - s) * 0.35}"/><text x="2" y="${y + 5}" font-size="15" font-family="IBM Plex Mono, monospace" fill="var(--muted)">${STRNAME[s]}</text>`; }
  for (let f = 1; f <= 12; f++) svg += `<text x="${x0 + (f - .5) * fw}" y="${H - 2}" font-size="15" text-anchor="middle" font-family="IBM Plex Mono, monospace" fill="var(--muted)">${f}</text>`;
  if (mark) { const y = top + gap * (5 - mark.s); svg += `<circle cx="${fx(mark.f)}" cy="${y}" r="13" fill="var(--accent)"/>${mark.label ? `<text x="${fx(mark.f)}" y="${y + 5}" font-size="14" text-anchor="middle" font-weight="700" fill="#fff">${esc(mark.label)}</text>` : ""}`; }
  return svg + `</svg>`;
}

  const frets = shape.split("").map(c => c === "x" ? -1 : Number(c)); const played = frets.filter(f => f > 0);

  for (let i = 0; i < 6; i++) s += `<line x1="${x0 + i * dx}" y1="${y0}" x2="${x0 + i * dx}" y2="${y0 + dy * 5}" stroke="var(--muted)" stroke-width="1.2"/>`;
  for (let j = 0; j <= 5; j++) s += `<line x1="${x0}" y1="${y0 + j * dy}" x2="${x0 + dx * 5}" y2="${y0 + j * dy}" stroke="${j === 0 && base === 1 ? "var(--fg)" : "var(--muted)"}" stroke-width="${j === 0 && base === 1 ? 4 : 1.2}"/>`;
  if (base > 1) s += `<text x="${x0 + dx * 5 + 6}" y="${y0 + dy * .7}" font-size="11" font-family="IBM Plex Mono, monospace" fill="var(--muted)">${base}</text>`;

/* dagens huskestue (Trivial Pursuit-format) */
function wedges(){
  const f = feed(), qs = f?.trivia || [], ans = S.tpDoc?.answers || {};
  const r = 34, cx = 40, cy = 40; let paths = "";
  TP.forEach((t, i) => {
    const qi = qs.findIndex(q => String(q.cat).toLowerCase() === t.k.toLowerCase());
    const won = qi >= 0 && ans[qi] !== undefined && Number(ans[qi]) === Number(qs[qi].answer);
    const a0 = (i * 60 - 90) * Math.PI / 180, a1 = ((i + 1) * 60 - 90) * Math.PI / 180;
    const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0), x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    paths += `<path d="M${cx},${cy} L${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 0 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z" fill="${won ? t.c : "var(--surface-2)"}" stroke="var(--surface)" stroke-width="2"/>`;
  });
  return `<svg width="80" height="80" viewBox="0 0 80 80" role="img" aria-label="Kakebiter vunnet i dag"><circle cx="40" cy="40" r="37" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>${paths}</svg>`;
}
function learnTp(){
  const f = feed(), qs = f?.trivia || [], ans = S.tpDoc?.answers || {};

  return `<div class="panel tp">${wedges()}<div class="stack" style="flex:1;min-width:180px"><h2>Dagens huskestue</h2><p class="muted">Seks kategorier, ett spørsmål hver. Riktig svar gir kakebiten. ${won}/6 i dag.</p></div></div>

const IMP = {items: [], plan: null, busy: false, status: "", paste: ""};
function htmlToLines(html){
  const doc = new DOMParser().parseFromString(html, "text/html"), lines = [];
  doc.querySelectorAll("script,style,head,title").forEach(e => e.remove());
  const txt = el => (el.textContent || "").replace(/ /g, " ").replace(/[ \t]+/g, " ").trim();
  const walk = el => {
    for (const c of el.children) {
      const tag = c.tagName.toLowerCase();
      if (/^h[1-3]$/.test(tag)) { const t = txt(c); if (t) lines.push("#".repeat(Number(tag[1])) + " " + t); }
      else if (/^h[4-6]$/.test(tag)) { const t = txt(c); if (t) lines.push("### " + t); }
      else if (tag === "li") { const box = c.querySelector("input[type=checkbox]"); const t = txt(c); if (t) lines.push((box ? (box.checked ? "[x] " : "[] ") : (c.parentElement?.tagName === "OL" ? "1. " : "- ")) + t); }
      else if (tag === "ul" || tag === "ol") walk(c);
      else if (tag === "table") { c.querySelectorAll("tr").forEach(tr => { const cells = [...tr.children].map(txt).filter(Boolean); if (cells.length) lines.push(cells.join(" | ")); }); }
      else if (tag === "blockquote") { const t = txt(c); if (t) lines.push("> " + t); }
      else if (tag === "pre") { const t = c.textContent.trim(); if (t) lines.push("``` " + t); }
      else if (tag === "hr") lines.push("---");
      else if (["p","div","section","article","span","td","font"].includes(tag) && !c.querySelector("p,div,li,h1,h2,h3,table,ul,ol")) { const t = txt(c); if (t) lines.push(t); }
      else if (tag === "br") continue;
      else walk(c);
    }
  };
  walk(doc.body || doc.documentElement);
  return lines;
}
function mhtToHtml(raw){
  const m = raw.match(/boundary="?([^"\r\n;]+)"?/i); const parts = m ? raw.split("--" + m[1]) : [raw];
  const p = parts.find(x => /content-type:\s*text\/html/i.test(x)) || raw;
  let body = p.replace(/^[\s\S]*?\r?\n\r?\n/, "");
  if (/quoted-printable/i.test(p)) body = body.replace(/=\r?\n/g, "").replace(/=([0-9A-F]{2})/gi, (_, h) => String.fromCharCode(parseInt(h, 16)));
  try { body = decodeURIComponent(escape(body)); } catch {}
  return body;
}

  db.collection("kort-vg3").onSnapshot(snap => { S.vg3Cards = snap.docs.map(d => ({id: d.id, ...thaw(d)})); if (S.view === "laering" && S.learnSub === "vg3" && !S.session) render(); else renderHeader(); }, () => {});
  db.collection("kort").onSnapshot(snap => { S.ownCards = snap.docs.map(d => ({id: d.id, ...thaw(d)})); if (S.view === "laering" && !document.activeElement?.closest?.("#genpanel")) render(); else renderHeader(); }, () => {});
  db.collection("notater").onSnapshot(snap => {
    const incoming = snap.docs.map(d => ({id: d.id, ...thaw(d)})), open = curNote();
    S.notes = incoming.map(n => (open && n.id === open.id && (N.dirty || editorFocused())) ? open : n);
    if (open && !S.notes.find(n => n.id === open.id) && !N.dirty) N.open = null;
    if (S.view !== "notater") return; if (editorFocused()) { const sd = $(".nside"); if (sd && document.activeElement?.id !== "nsearch") sd.innerHTML = notesSide(); } else render();
  }, () => {});
  db.collection("import-onenote").onSnapshot(snap => { const docs = snap.docs.map(d => ({id: d.id, ...thaw(d)}));
    OXP.meta = docs.find(d => d.id === "meta") || null; OXP.chunks = docs.filter(d => d.id !== "meta"); if (S.view === "notater" && !editorFocused() && !IMP.busy) render(); }, () => {});
  loadLearnDoc("learn/own", "own", () => ({s:{}, settings: defaultSettings("own"), stats:{}}));
  loadLearnDoc("learn/vg3", "vg3", () => ({s:{}, settings: defaultSettings("vg3"), stats:{}}));
  loadLearnDoc("learn/geo", "geo", () => ({s:{}, settings: defaultSettings("geo"), stats:{}}));
  loadLearnDoc("learn/hist", "hist", () => ({s:{}, settings: defaultSettings("hist"), stats:{}}));
  loadLearnDoc("learn/guitar", "G", () => ({fb:{}, fbDays:{}, fbNat:true, ear:{ok:0, n:0}, earMode:"iv", earLevel:"lett", known:[]}));
  render();
}
let tpUnsub = null, tpDate = null;
function subscribeTp(){
  const f = feed(); if (!f || !S.db || f.date === tpDate) return; tpDate = f.date; tpUnsub && tpUnsub();
  S.tpDoc = {}; tpUnsub = S.db.doc("quiz/" + f.date).onSnapshot(s => { S.tpDoc = s.exists ? thaw(s) : {}; if (S.view === "idag" || (S.view === "laering" && S.learnSub === "tp")) render(); }, () => {});
}
$("#daysel").addEventListener("change", () => { tpDate = null; subscribeTp(); });
boot();
})();
